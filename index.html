<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0E7490">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CBS4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<title>Condominio Bosques del Sur 4</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="bg-particles"></canvas>
<div id="loading-overlay" class="loading-overlay"><div class="spinner"></div><div class="loading-text">Conectando con Firebase...</div></div>
<div id="login-screen">
<div class="login-bg" aria-hidden="true"></div>
<div class="login-blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="login-card">
<div class="logo-circ"><img id="logo-login" alt="Logo"/></div>
<div class="login-title">CONDOMINIO<br>BOSQUES DEL SUR 4</div>
<div class="login-sub" id="login-sub-text">Panel de Administración</div>
<form id="login-form-area" onsubmit="doLogin();return false;" novalidate>
<label class="login-label" for="usr">Usuario</label>
<div class="login-field"><svg class="lf-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
<input id="usr" name="username" type="text" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="tu usuario"/></div>
<label class="login-label" for="pwd">Contraseña</label>
<div class="login-field"><svg class="lf-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
<input id="pwd" name="password" type="password" autocomplete="current-password" placeholder="••••••••"/>
<button type="button" class="lf-eye" id="pwd-eye" onclick="togglePwd()" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></div>
<button class="login-btn" id="login-btn" type="submit"><span class="lb-txt">Ingresar al Sistema</span><span class="lb-spin" aria-hidden="true"></span></button>
</form>
<div id="biometric-area" style="display:none;margin-bottom:14px;">
<button class="login-btn" style="font-size:16px;" onclick="loginConHuella()">👆 Ingresar con huella</button>
<div style="margin-top:10px;"><a href="#" style="color:rgba(255,255,255,.7);font-size:12px;" onclick="showPasswordForm();return false;">Usar contraseña</a></div>
</div>
<div class="login-error" id="login-err" role="alert" aria-live="polite"></div>
<div class="transp-link"><a href="#" onclick="enterTransparencia();return false;">👁 Vista Transparencia (residentes)</a></div>
</div>
</div>
<div id="app">
<div id="transp-banner-el" class="transp-banner" style="display:none">👁 Vista Transparencia — Solo lectura para residentes &nbsp;|&nbsp;<a href="#" onclick="backToLogin();return false;">← Volver</a></div>
<div class="topbar">
<button class="hamburger" onclick="openDrawer()" aria-label="Menú">☰</button>
<div class="topbar-logo"><img id="topbar-logo" alt="Logo"/></div>
<div><div class="topbar-title">Bosques del Sur 4</div><div class="topbar-sub">Gestión de Condominio</div></div>
<div style="flex:1"></div>
<div class="topbar-right">
<span id="sync-indicator" title="Estado sincronización" style="font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px;"><span class="sync-dot loading" id="sync-dot"></span><span id="sync-text">Conectando</span></span>
<select class="year-sel" id="year-sel" onchange="changeYear(this.value)"></select>
<button class="icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema">🌙</button>
<span id="badge-el" class="badge-admin">Admin</span>
<button class="logout-btn" id="logout-btn" onclick="doLogout()">Salir</button>
</div>
</div>
<div class="app-body">
<div class="sidebar" id="sidebar"></div>
<div class="main" id="main-content"></div>
</div>
</div>
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
<div class="drawer-header">
<div class="drawer-logo"><img id="drawer-logo" alt="Logo"/></div>
<div style="flex:1"><div class="drawer-title">Bosques del Sur 4</div><div class="drawer-sub" id="drawer-sub">Administración</div></div>
<button class="drawer-close" onclick="closeDrawer()">✕</button>
</div>
<div class="drawer-nav" id="drawer-nav"></div>
<div class="drawer-footer" id="drawer-footer"></div>
</div>
<div id="modal-area"></div>
<div class="toast" id="toast-el"></div>
<script src="logo-voucher.js"></script>
<script src="core.js"></script>
<script src="vistas.js"></script>
<script src="vistas2.js"></script>
<script src="multas.js"></script>
<script src="mantenciones.js"></script>
<script src="auditoria.js"></script>
<script src="respaldos.js"></script>
<script src="proveedores.js"></script>
<script src="pdf-lib.min.js"></script>
<script src="certificados_pdf.js"></script>
<script src="certificados.js"></script>
<script src="novedades.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').then(r=>console.log('SW registered:',r.scope)).catch(e=>console.log('SW error:',e)); }); }
</script>
</body>
</html>
