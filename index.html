<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1E1B6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CBS4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Condominio Bosques del Sur 4</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@300;400;500;600;700&display=swap');
:root{
--navy:#1E1B6E;--navy-light:#2D2A8E;--navy-dark:#141252;
--green:#4A7C59;--green-light:#6BA882;--green-pale:#E8F4EC;
--cream:#F8F7FF;--white:#FFFFFF;
--gray-100:#F3F3FA;--gray-200:#E8E8F0;--gray-400:#9090B0;--gray-700:#3D3D6B;
--danger:#E05252;--warning:#E0A025;
--bg:var(--cream);--surface:#FFFFFF;--surface2:#F3F3FA;--border:#E8E8F0;
--text:#141252;--text2:#3D3D6B;--text3:#9090B0;
--topbar-bg:#1E1B6E;
--shadow:0 8px 32px rgba(30,27,110,.12);--shadow-sm:0 2px 12px rgba(30,27,110,.08);
--neon-cyan:#00F3FF;--neon-green:#00FF9D;--neon-purple:#B026FF;--neon-pink:#FF007A;
--glow-cyan:0 0 12px rgba(0,243,255,.45),0 0 24px rgba(0,243,255,.2);
--glow-green:0 0 12px rgba(0,255,157,.45),0 0 24px rgba(0,255,157,.2);
--glow-purple:0 0 12px rgba(176,38,255,.45),0 0 24px rgba(176,38,255,.2);
--glow-pink:0 0 12px rgba(255,0,122,.45),0 0 24px rgba(255,0,122,.2);
--glass-bg:rgba(255,255,255,.85);--glass-border:rgba(255,255,255,.6);
}
[data-theme="dark"]{
--bg:#0A0919;--surface:#13112C;--surface2:#1A1836;--border:#2A2845;
--text:#E8E6FF;--text2:#B0ACDC;--text3:#706C9A;
--topbar-bg:#060512;
--shadow:0 8px 32px rgba(0,0,0,.5);--shadow-sm:0 2px 12px rgba(0,0,0,.4);
--glass-bg:rgba(19,17,44,.85);--glass-border:rgba(42,40,69,.8);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
transition:background .35s,color .35s;}
#bg-particles{position:fixed;inset:0;z-index:-1;pointer-events:none;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#060512 0%,#1E1B6E 50%,#2D2A8E 100%);}
.login-card{background:var(--glass-bg);border-radius:24px;padding:40px 32px;width:380px;
max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;
border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
position:relative;}
.login-card::before{content:'';position:absolute;inset:-2px;border-radius:26px;padding:2px;
background:linear-gradient(135deg,var(--neon-cyan),var(--neon-purple),var(--neon-green));
-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;opacity:.6;pointer-events:none;
animation:borderHue 5s linear infinite;}
@keyframes borderHue{0%{filter:hue-rotate(0deg);}100%{filter:hue-rotate(360deg);}}
.logo-circ{width:100px;height:100px;margin:0 auto 14px;border-radius:50%;overflow:hidden;border:3px solid var(--neon-cyan);
box-shadow:var(--glow-cyan);}
.logo-circ img{width:100%;height:100%;object-fit:cover;}
.login-title{font-family:'Playfair Display',serif;color:var(--navy);font-size:18px;font-weight:700;margin-bottom:4px;}
[data-theme="dark"] .login-title{color:#E8E6FF;}
.login-sub{color:var(--text3);font-size:13px;margin-bottom:28px;}
.login-label{display:block;text-align:left;font-size:11px;font-weight:700;color:var(--text);
text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.login-input{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;
font-family:'Nunito',sans-serif;font-size:14px;outline:none;transition:all .25s ease;
margin-bottom:14px;background:var(--surface);color:var(--text);}
.login-input:focus{border-color:var(--neon-cyan);box-shadow:0 0 0 3px rgba(0,243,255,.2);}
[data-theme="dark"] .login-input:focus{border-color:var(--neon-purple);box-shadow:0 0 0 3px rgba(176,38,255,.25);}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--navy),#0f172a);color:#fff;border:1px solid rgba(0,243,255,.35);border-radius:10px;
font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s ease;position:relative;overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.3);}
.login-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .5s;pointer-events:none;}
.login-btn:hover::before{transform:translateX(100%);}
.login-btn:hover{transform:translateY(-2px);border-color:var(--neon-cyan);box-shadow:var(--glow-cyan);}
.login-btn:active{transform:translateY(0);}
.login-error{color:var(--neon-pink);font-size:13px;margin-top:8px;min-height:18px;text-shadow:0 0 8px rgba(255,0,122,.3);}
.transp-link{margin-top:18px;}
.transp-link a{color:var(--neon-green);font-size:13px;text-decoration:none;font-weight:600;transition:all .2s;
text-shadow:0 0 6px rgba(0,255,157,.3);}
.transp-link a:hover{text-shadow:0 0 12px rgba(0,255,157,.6);}
#app{display:none;min-height:100vh;flex-direction:column;}
.topbar{background:linear-gradient(135deg,#0a0919 0%,#1a1847 50%,#2d2a8e 100%);color:#fff;padding:0 16px;display:flex;align-items:center;
height:56px;gap:12px;position:sticky;top:0;z-index:100;
border-bottom:2px solid transparent;
border-image:linear-gradient(90deg,#00F3FF,#B026FF,#00FF9D) 1;
animation:topbarGlow 3s ease-in-out infinite alternate;overflow:hidden;}
@keyframes topbarGlow{0%{box-shadow:0 4px 20px rgba(0,243,255,.3),0 0 30px rgba(176,38,255,.2);}100%{box-shadow:0 4px 25px rgba(0,243,255,.5),0 0 40px rgba(176,38,255,.35);}}
.topbar::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
background:linear-gradient(90deg,transparent,rgba(0,243,255,.15),transparent);
animation:topbarShine 4s infinite;pointer-events:none;}
@keyframes topbarShine{0%{left:-100%;}100%{left:100%;}}
.topbar-logo{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid #00F3FF;
animation:logoPulse 2s ease-in-out infinite;}
@keyframes logoPulse{0%,100%{box-shadow:0 0 12px rgba(0,243,255,.6),0 0 20px rgba(0,243,255,.3);}50%{box-shadow:0 0 18px rgba(0,243,255,.8),0 0 30px rgba(0,243,255,.5);}}
.topbar-logo img{width:100%;height:100%;object-fit:cover;}
.topbar-title{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;flex:1;color:#fff;
text-shadow:0 0 10px rgba(0,243,255,.5),0 0 20px rgba(176,38,255,.3);}
.topbar-sub{font-size:10px;color:rgba(255,255,255,.7);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.year-sel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;
padding:5px 10px;border-radius:8px;font-family:'Nunito',sans-serif;font-size:12px;outline:none;cursor:pointer;transition:all .2s;}
.year-sel:hover,.year-sel:focus{border-color:var(--neon-cyan);box-shadow:var(--glow-cyan);}
.icon-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;
width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;
justify-content:center;font-size:16px;transition:all .2s;}
.icon-btn:hover{background:rgba(0,243,255,.12);border-color:var(--neon-cyan);box-shadow:var(--glow-cyan);}
.logout-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;
padding:5px 12px;border-radius:8px;font-family:'Nunito',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;}
.logout-btn:hover{border-color:var(--neon-pink);box-shadow:var(--glow-pink);color:#fff;}
.badge-admin{background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;text-transform:uppercase;box-shadow:0 2px 10px rgba(0,255,157,.35);}
.badge-view{background:var(--gray-400);color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;text-transform:uppercase;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block;margin-right:2px;transition:all .3s;box-shadow:0 0 6px rgba(74,222,128,.6);}
.sync-dot.off{background:#f87171;box-shadow:0 0 8px rgba(248,113,113,.5);}
.sync-dot.loading{background:#facc15;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.15);}}
.transp-banner{background:linear-gradient(135deg,rgba(0,243,255,.15),rgba(176,38,255,.15),rgba(0,255,157,.15));color:#fff;
padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#00F3FF,#00FF9D) 1;
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
position:relative;overflow:hidden;animation:bannerPulse 2.5s ease-in-out infinite alternate;}
@keyframes bannerPulse{0%{box-shadow:0 4px 20px rgba(0,243,255,.4),0 0 30px rgba(0,255,157,.3);}100%{box-shadow:0 4px 25px rgba(0,243,255,.6),0 0 40px rgba(0,255,157,.5);}}
.transp-banner::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
background:linear-gradient(90deg,transparent,rgba(0,255,157,.2),transparent);
animation:bannerShine 3s infinite;pointer-events:none;}
@keyframes bannerShine{0%{left:-100%;}100%{left:100%;}}
.transp-banner a{color:#00F3FF;text-decoration:underline;text-underline-offset:3px;transition:all .2s;text-shadow:0 0 8px rgba(0,243,255,.6);}
.transp-banner a:hover{text-shadow:0 0 15px rgba(0,243,255,.9),0 0 25px rgba(0,243,255,.5);}
/* ✅ BANNER DE DATOS BANCARIOS (compacto + neón) */
.bank-banner{background:var(--glass-bg);border:1px solid rgba(0,243,255,.3);border-radius:10px;padding:10px 14px;
display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative;overflow:hidden;
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:riseIn .4s ease backwards;
box-shadow:0 2px 12px rgba(0,243,255,.1);}
.bank-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(90deg,transparent,#00F3FF,#B026FF,transparent);opacity:.7;}
.bank-banner-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--navy),#0f172a);
display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;
box-shadow:0 0 8px rgba(0,243,255,.3);border:1px solid rgba(0,243,255,.3);}
.bank-banner-body{flex:1;min-width:0;}
.bank-banner-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.bank-banner-details{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text);align-items:center;}
.bank-banner-details strong{color:var(--text);font-weight:700;}
.bank-banner-detail{display:flex;align-items:center;gap:4px;}
.bank-banner-detail-label{color:var(--text3);font-size:10px;}
.bank-banner-copy{background:transparent;border:1px solid var(--border);color:var(--text2);
padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .2s;flex-shrink:0;
font-weight:600;}
.bank-banner-copy:hover{border-color:var(--neon-cyan);color:var(--neon-cyan);box-shadow:var(--glow-cyan);}
.app-body{display:flex;flex:1;}
.sidebar{width:200px;min-height:calc(100vh - 56px);background:var(--surface);
border-right:1px solid var(--border);padding:14px 0;flex-shrink:0;
position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:9px;padding:11px 16px;cursor:pointer;
color:var(--text2);font-size:13px;font-weight:600;transition:all .25s ease;
border-left:3px solid transparent;margin-bottom:1px;position:relative;}
.nav-item:hover{background:var(--surface2);color:var(--text);border-left-color:var(--gray-400);}
.nav-item.active{background:var(--bg);color:var(--neon-cyan);border-left-color:var(--neon-cyan);text-shadow:0 0 8px rgba(0,243,255,.4);}
[data-theme="dark"] .nav-item.active{color:var(--neon-cyan);border-left-color:var(--neon-cyan);}
.nav-sep{height:1px;background:var(--border);margin:10px 14px;}
.nav-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:6px 16px 3px;font-weight:700;}
.main{flex:1;padding:20px;overflow-y:auto;max-height:calc(100vh - 56px);}
.page-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:4px;
background:linear-gradient(90deg,#00F3FF,#B026FF,#00FF9D);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
position:relative;padding-bottom:10px;filter:drop-shadow(0 0 8px rgba(0,243,255,.3));}
.page-title::after{content:'';position:absolute;bottom:0;left:0;width:70px;height:3px;
background:linear-gradient(90deg,#00F3FF,#B026FF);border-radius:3px;
box-shadow:0 0 10px #00F3FF,0 0 20px rgba(176,38,255,.5);
animation:lineGrow 2s ease-in-out infinite alternate;}
@keyframes lineGrow{0%{width:70px;}100%{width:120px;}}
.page-sub{color:var(--text3);font-size:13px;margin-bottom:20px;position:relative;padding-left:12px;}
.page-sub::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;
background:#00FF9D;border-radius:2px;animation:accentPulse 2s ease-in-out infinite alternate;}
@keyframes accentPulse{0%{box-shadow:0 0 8px #00FF9D,0 0 15px rgba(0,255,157,.5);}100%{box-shadow:0 0 12px #00FF9D,0 0 25px rgba(0,255,157,.8);}}
.card{background:var(--glass-bg);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);
border:1px solid rgba(0,243,255,.2);transition:all .3s ease;
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(90deg,transparent,#00F3FF,#B026FF,transparent);
opacity:0;transition:opacity .3s;pointer-events:none;}
#main-content .card::after{content:'';position:absolute;inset:8px;pointer-events:none;opacity:.35;transition:opacity .3s;
background:
linear-gradient(#00F3FF,#00F3FF) left top/14px 2px no-repeat,
linear-gradient(#00F3FF,#00F3FF) left top/2px 14px no-repeat,
linear-gradient(#00F3FF,#00F3FF) right top/14px 2px no-repeat,
linear-gradient(#00F3FF,#00F3FF) right top/2px 14px no-repeat,
linear-gradient(#00F3FF,#00F3FF) left bottom/14px 2px no-repeat,
linear-gradient(#00F3FF,#00F3FF) left bottom/2px 14px no-repeat,
linear-gradient(#00F3FF,#00F3FF) right bottom/14px 2px no-repeat,
linear-gradient(#00F3FF,#00F3FF) right bottom/2px 14px no-repeat;}
#main-content .card:hover::after{opacity:.9;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,243,255,.3),0 0 40px rgba(176,38,255,.2);border-color:#00F3FF;}
.card:hover::before{opacity:1;}
.card-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--navy);margin-bottom:14px;font-weight:600;text-shadow:0 0 5px rgba(0,243,255,.2);}
[data-theme="dark"] .card-title{color:#E8E6FF;text-shadow:0 0 8px rgba(0,243,255,.4);}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
#main-content .stat-card{animation:riseIn .5s ease backwards;}
#main-content .stat-card:nth-child(2){animation-delay:.07s;}
#main-content .stat-card:nth-child(3){animation-delay:.14s;}
#main-content .stat-card:nth-child(4){animation-delay:.21s;}
#main-content .stat-card:nth-child(5){animation-delay:.28s;}
#main-content .card{animation:riseIn .5s ease backwards;}
#main-content .charts-grid .card:nth-child(2){animation-delay:.1s;}
.holo-wrap{position:relative;border-radius:10px;overflow:hidden;}
.holo-wrap::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
background:linear-gradient(115deg,transparent 30%,rgba(0,243,255,.18) 44%,rgba(176,38,255,.22) 50%,rgba(0,255,157,.18) 56%,transparent 70%);
background-size:220% 100%;animation:holoSweep 3s ease-in-out infinite;}
@keyframes holoSweep{0%{background-position:130% 0;}100%{background-position:-130% 0;}}
.month-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:20px;}
.month-tab{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;
border:2px solid var(--border);color:var(--text3);transition:all .25s ease;background:var(--surface);}
.month-tab:hover{border-color:var(--navy);color:var(--navy);transform:translateY(-2px);}
.month-tab.active{background:linear-gradient(135deg,var(--navy),#0f172a);color:#fff;border-color:var(--neon-cyan);box-shadow:var(--glow-cyan);}
[data-theme="dark"] .month-tab.active{background:linear-gradient(135deg,#1e1b4b,#0f172a);border-color:var(--neon-purple);box-shadow:var(--glow-purple);}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:var(--glass-bg);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);
border:1px solid var(--glass-border);border-top:4px solid transparent;transition:transform .25s ease,box-shadow .25s ease;
backdrop-filter:blur(6px);}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.12);}
.stat-card.blue{border-top-color:var(--neon-cyan);}
.stat-card.green{border-top-color:var(--neon-green);}
.stat-card.red{border-top-color:var(--neon-pink);}
.stat-card.orange{border-top-color:var(--warning);}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:6px;}
.stat-value{font-size:22px;font-weight:700;color:var(--text);line-height:1.1;}
.stat-value.small{font-size:16px;}
.stat-meta{font-size:11px;color:var(--text3);margin-top:3px;}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
canvas{max-height:200px;}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:9px 12px;background:var(--surface2);color:var(--text);
font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,243,255,.04);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent;}
.badge-green{background:rgba(0,255,157,.12);color:var(--neon-green);border-color:rgba(0,255,157,.3);}
[data-theme="dark"] .badge-green{background:rgba(0,255,157,.15);color:var(--neon-green);border-color:rgba(0,255,157,.4);}
.badge-red{background:rgba(255,0,122,.1);color:var(--neon-pink);border-color:rgba(255,0,122,.3);}
[data-theme="dark"] .badge-red{background:rgba(255,0,122,.15);color:#FF4DA6;border-color:rgba(255,0,122,.4);}
.badge-orange{background:rgba(224,160,37,.1);color:var(--warning);border-color:rgba(224,160,37,.3);}
[data-theme="dark"] .badge-orange{background:rgba(224,160,37,.15);color:#E0B55A;border-color:rgba(224,160,37,.4);}
.badge-navy{background:rgba(30,27,110,.08);color:var(--navy);border-color:rgba(30,27,110,.2);}
[data-theme="dark"] .badge-navy{background:rgba(107,103,212,.2);color:#A8A4FF;border-color:rgba(107,103,212,.3);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:9px;
font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;text-decoration:none;}

authDomain: "bosques-del-sur-4.firebaseapp.com",
databaseURL: "https://bosques-del-sur-4-default-rtdb.firebaseio.com",
projectId: "bosques-del-sur-4",
storageBucket: "bosques-del-sur-4.firebasestorage.app",
messagingSenderId: "201777693828",
appId: "1:201777693828:web:59371297fdcc14ef3daed1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const LOGO_SRC = 'Timbre La balada.png';

{u:'T.diaz', p:'Diaz_123', rol:'Presidenta'}
];

loggedIn:false, isTransparencia:false,
currentView:'dashboard', currentYear:new Date().getFullYear(), currentMonth:new Date().getMonth(),

formulariosSortAsc: false
};

function defaultData(){
return {
departamentos: Array.from({length:18},(_,i)=>({
id:i+1, numero:String(i+1).padStart(2,'0'), representante:'', contacto:''
})),
pagos:{}, ingresosExtra:[],
gastosFijos:{},

configuracion:{tema:'light'},
formularios:[],
multas: []
};

let appData = defaultData();
let firebaseListener = null;

function initFirebase(){
db.ref('.info/connected').on('value', snap => {
state.connected = snap.val() === true;
const dot = document.getElementById('sync-dot');
const txt = document.getElementById('sync-text');
if(dot && txt){
dot.className = 'sync-dot ' + (state.connected ? '' : 'off');
txt.textContent = state.connected ? 'En línea' : 'Sin conexión';
}
});

firebaseListener = db.ref('cbs4').on('value', snap => {
const val = snap.val();
if(val){
appData = {
...defaultData(),
...val,
departamentos: val.departamentos || defaultData().departamentos,
gastosFijos: val.gastosFijos || {},
gastosVariables: val.gastosVariables || [],
ingresosExtra: val.ingresosExtra || [],
pagos: val.pagos || {},
gastoComunHistorial: val.gastoComunHistorial || [{desde:'2022-01',valor:DEFAULT_GC}],
configuracion: val.configuracion || {tema:'light'},
formularios: val.formularios || [],
multas: val.multas || []
};
} else {
db.ref('cbs4').set(appData);
}

const overlay = document.getElementById('loading-overlay');
if(overlay && overlay.style.display !== 'none'){
overlay.style.display = 'none';
document.getElementById('login-screen').style.display = 'flex';
if(appData.configuracion && appData.configuracion.tema === 'dark'){
state.theme = 'dark';
document.documentElement.setAttribute('data-theme','dark');
const btn = document.getElementById('theme-btn');
if(btn) btn.textContent = '☀️';
}
}

if(state.loggedIn || state.isTransparencia){
renderView();
}
});
}

const SESSION_KEY = 'cbs4_session';

function saveSession(usuario) { localStorage.setItem(SESSION_KEY, JSON.stringify({usuario, ts: Date.now()})); }
function clearSession() { localStorage.removeItem(SESSION_KEY); localStorage.removeItem('cbs4_biometric_enabled'); }

function checkSession() {
try {
const s = JSON.parse(localStorage.getItem(SESSION_KEY));
if (!s) return null;
const days = (Date.now() - s.ts) / (1000 * 60 * 60 * 24);
if (days > SESSION_DAYS) { clearSession(); return null; }
return s.usuario;
} catch(e) { return null; }
}

function isBiometricAvailable() { return window.PublicKeyCredential && typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function'; }
async function biometricAvailable() { if (!isBiometricAvailable()) return false; try { return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch(e) { return false; } }

async function registerBiometric(usuario) {
try {
const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
const userId = new TextEncoder().encode(usuario);
await navigator.credentials.create({ publicKey: { challenge, rp: { name: 'Bosques del Sur 4', id: location.hostname }, user: { id: userId, name: usuario, displayName: usuario }, pubKeyCredParams: [{ alg: -7, type: 'public-key' }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
localStorage.setItem('cbs4_biometric_enabled', usuario); showToast('Huella registrada ✓','success'); return true;
} catch(e) { console.log('Biometric register error:', e); return false; }
}

async function verifyBiometric() {
const usuario = localStorage.getItem('cbs4_biometric_enabled'); if (!usuario) return null;
try {
const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
await navigator.credentials.get({ publicKey: { challenge, timeout: 60000, userVerification: 'required', rpId: location.hostname } });
return usuario;
} catch(e) { console.log('Biometric verify error:', e); return null; }
}

function animateCounters(){
try{
document.querySelectorAll('#main-content .stat-value').forEach(el=>{
if(el.children.length) return;
const original = el.textContent.trim();
const digits = original.replace(/[^\d]/g,'');
if(!digits) return;
const target = parseInt(digits,10);
if(isNaN(target) || target<=0) return;
const negative = original.indexOf('-') !== -1;
const dur = 900; const start = performance.now();
function frame(t){
const p = Math.min(1,(t-start)/dur);
const e = 1-Math.pow(1-p,3);
const val = Math.round(target*e);
el.textContent = (negative?'-':'') + fmt(val);
if(p<1){ requestAnimationFrame(frame); } else { el.textContent = original; }
}
requestAnimationFrame(frame);
});
}catch(e){}
}

function initParticles(){
try{
const c=document.getElementById('bg-particles'); if(!c) return;
const ctx=c.getContext('2d'); if(!ctx) return;
if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
let W,H,pts=[];
function resize(){
W=c.width=window.innerWidth; H=c.height=window.innerHeight;
const n=Math.min(70,Math.floor(W/22));
pts=Array.from({length:n},()=>({
x:Math.random()*W,y:Math.random()*H,
vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,
r:Math.random()*1.6+1,
c:Math.random()<.6?'0,243,255':'176,38,255'
}));
}
resize(); window.addEventListener('resize',resize);
(function loop(){
ctx.clearRect(0,0,W,H);
const dark=document.documentElement.getAttribute('data-theme')==='dark';
const base=dark?.6:.45;
for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
if(d<150*150){const al=(1-Math.sqrt(d)/150)*base*.55;
ctx.strokeStyle='rgba(0,243,255,'+al.toFixed(3)+')';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
}
for(const p of pts){ctx.fillStyle='rgba('+p.c+','+(base*.9).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
requestAnimationFrame(loop);
})();
}catch(e){}
}

function calcularBalanceGeneral() {
  let total = 0;
  for (let anio = 2018; anio <= 2028; anio++) {
    for (let mes = 0; mes < 12; mes++) {
      const key = mkKey(anio, mes);
      const gc = getGC(anio, mes);
      const pagos = appData.pagos[key] || {};
      total += Object.values(pagos).filter(Boolean).length * gc;
      total += (appData.ingresosExtra || []).filter(e => e.anio === anio && e.mes === mes).reduce((s, e) => s + (e.monto || 0), 0);
      total += (appData.multas || []).filter(m => m.anio === anio && m.mes === mes && m.estado === 'Pagada').reduce((s, m) => s + (m.monto || 0), 0);
      total -= (appData.gastosFijos[key] || []).reduce((s, g) => s + (g.monto || 0), 0);
      total -= (appData.gastosVariables || []).filter(v => v.anio === anio && v.mes === mes).reduce((s, v) => s + (v.monto || 0), 0);
    }
  }
  return total;
}

function eximirDepto(deptoId, button) {
const row = document.getElementById(`depto-row-${deptoId}`);
const label = row.querySelector('label');
const checkbox = row.querySelector('input[type="checkbox"]');
const isEximido = label.querySelector('.eximido-label');

if (isEximido) {
button.textContent = 'Eximir';
button.classList.remove('btn-outline');
button.classList.add('btn-ghost');
label.style.backgroundColor = '';
const lbl = label.querySelector('.eximido-label');
if (lbl) lbl.remove();
checkbox.disabled = false;
checkbox.checked = false;
} else {
button.textContent = 'Restaurar';
button.classList.add('btn-outline');
button.classList.remove('btn-ghost');
label.style.backgroundColor = '#f0f0f0';
if (!label.querySelector('.eximido-label')) {
const span = document.createElement('span');
span.className = 'eximido-label';
span.style.cssText = 'color:var(--text3);font-size:11px;';
span.textContent = '(Eximido)';
label.insertBefore(span, button);
}
checkbox.disabled = true;
checkbox.checked = false;
}
updatePactoCount();
}

function saveIngreso(editId){
const {currentYear,currentMonth}=state;
const desc=document.getElementById('ni-d').value.trim();
const tipo=document.getElementById('ni-t').value;
let monto=0;
let montoUnitario=0;
let departamentosPagados=[];
let departamentosEximidos=[];

if(tipo === 'Pacto Cuotas'){
montoUnitario = parseInt(document.getElementById('ni-m-unit').value)||0;
const checks = document.querySelectorAll('.depto-check:checked');
checks.forEach(c => {
const id = parseInt(c.getAttribute('data-depto-id') || c.value);
departamentosPagados.push(id);
});
const eximidos = document.querySelectorAll('.eximido-label');
eximidos.forEach(el => {
const row = el.closest('.depto-row');
const checkbox = row.querySelector('input[type="checkbox"]');
departamentosEximidos.push(parseInt(checkbox.getAttribute('data-depto-id')));
});
monto = montoUnitario * departamentosPagados.length;
if(departamentosPagados.length === 0){
showToast('Seleccione al menos un departamento','error');
return;
}
} else {
monto = parseInt(document.getElementById('ni-m').value)||0;
}

if(!desc||monto<=0){showToast('Complete los campos','error');return;}
if(!appData.ingresosExtra)appData.ingresosExtra=[];

if(editId){
const idx = appData.ingresosExtra.findIndex(x=>x.id===editId);
if(idx!==-1){
appData.ingresosExtra[idx] = {
...appData.ingresosExtra[idx],
descripcion: desc, tipo: tipo, monto: monto,
montoUnitario: montoUnitario, departamentosPagados: departamentosPagados,
departamentosEximidos: departamentosEximidos
};
}
} else {
appData.ingresosExtra.push({
id:Date.now(), anio:currentYear, mes:currentMonth,
descripcion:desc, tipo:tipo, monto:monto,
montoUnitario:montoUnitario, departamentosPagados:departamentosPagados,
departamentosEximidos:departamentosEximidos
});
}
saveData();closeModal();
renderView();
showToast('Registrado ✓','success');
}

function delIngreso(id){
appData.ingresosExtra=(appData.ingresosExtra||[]).filter(x=>x.id!=id);
saveData();
renderView();
showToast('Eliminado');
}

function quitarAdjunto(tipo, id, key){

function descargarFormulario(id){
const f=(appData.formularios||[]).find(x=>x.id===id); if(!f) return;
const W=600, H=f.detalle?580:520;
const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
const grad=ctx.createLinearGradient(0,0,W,0); grad.addColorStop(0,'#141252'); grad.addColorStop(1,'#2D2A8E');
ctx.fillStyle=grad; ctx.fillRect(0,0,W,100);

function generarVoucher(key, deptoId) {
const {currentYear, currentMonth} = state; const gc = getGC(currentYear, currentMonth);
const depto = (appData.departamentos||[]).find(d=>d.id===deptoId); if(!depto) return;
const ahora = new Date(); const fechaStr = ahora.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
const horaStr = ahora.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); const mesStr = MESES[currentMonth] + ' ' + currentYear;
const W = 600, H = 820; const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H; const ctx = canvas.getContext('2d');
const dibujarVoucher = (dibujarLogo) => {
ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,H);
const grad = ctx.createLinearGradient(0,0,W,0); grad.addColorStop(0,'#141252'); grad.addColorStop(1,'#2D2A8E'); ctx.fillStyle = grad; ctx.fillRect(0,0,W,160);
ctx.save(); ctx.beginPath(); ctx.arc(W/2, 90, 50, 0, Math.PI*2); ctx.clip(); dibujarLogo(ctx, W/2, 90, 50); ctx.restore();
ctx.beginPath(); ctx.arc(W/2, 90, 52, 0, Math.PI*2); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 15px Nunito, Arial'; ctx.textAlign = 'center'; ctx.fillText('CONDOMINIO BOSQUES DEL SUR 4', W/2, 175);
ctx.fillStyle = '#000000'; ctx.font = 'bold 13px Nunito, Arial'; ctx.fillText('Voucher válido como comprobante de pago', W/2, 195);
ctx.fillStyle = '#4A7C59'; roundRect(ctx, W/2-80, 210, 160, 44, 22); ctx.fill();
ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 20px Nunito, Arial'; ctx.fillText('✓ PAGADO', W/2, 239);
ctx.strokeStyle = '#E8E8F0'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(40,260); ctx.lineTo(W-40,260); ctx.stroke();
let y = 300; sectionTitle(ctx, 'Datos del Departamento', W, y); y += 40;
dataRow(ctx, 'Departamento', depto.numero, W, y); y += 44; dataRow(ctx, 'Representante', depto.representante||'—', W, y); y += 44; dataRow(ctx, 'Contacto', depto.contacto||'—', W, y); y += 50;
ctx.strokeStyle = '#E8E8F0'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(W-40,y); ctx.stroke(); y += 30;
sectionTitle(ctx, 'Datos del Pago', W, y); y += 40; dataRow(ctx, 'Período', mesStr, W, y); y += 44; dataRow(ctx, 'Monto Gasto Común', fmt(gc), W, y); y += 44;
dataRow(ctx, 'Fecha de Pago', fechaStr, W, y); y += 44; dataRow(ctx, 'Hora', horaStr, W, y); y += 50;
ctx.strokeStyle = '#E8E8F0'; ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(W-40,y); ctx.stroke(); y += 30;
ctx.fillStyle = '#9090B0'; ctx.font = '11px Nunito, Arial'; ctx.textAlign = 'center'; ctx.fillText('Documento generado automáticamente', W/2, y+20);
ctx.fillText('Condominio Bosques del Sur 4 — ' + new Date().getFullYear(), W/2, y+38);
ctx.fillStyle = '#1E1B6E'; ctx.fillRect(0, H-8, W, 8);
try { return canvas.toDataURL('image/jpeg', 0.95); } catch(e) { console.warn('Canvas tainted on Android, using SVG fallback'); return null; }
};
const drawFallback = (ctx, cx, cy, r) => { ctx.fillStyle = '#E8E6FF'; ctx.fillRect(cx-r, cy-r, r*2, r*2); ctx.fillStyle = '#1E1B6E'; ctx.font = `bold ${r*0.7}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('CBS4', cx, cy+2); ctx.textBaseline = 'alphabetic'; };
const img = new Image(); img.crossOrigin = 'Anonymous'; img.src = LOGO_SRC; let shown = false;
const showVoucher = (fn) => {
if(shown) return; shown = true; const url = dibujarVoucher(fn || drawFallback);
if(url) mostrarVoucher(url, depto, mesStr, gc); else showToast('Error generando imagen','error');
};
img.onload = () => showVoucher((ctx, cx, cy, r) => { ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip(); ctx.drawImage(img, cx-r, cy-r, r*2, r*2); ctx.restore(); });
img.onerror = () => showVoucher(drawFallback); setTimeout(() => showVoucher(drawFallback), 1500);
}

function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r); ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h); ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r); ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath(); }
function sectionTitle(ctx, text, W, y) { ctx.fillStyle = '#1E1B6E'; ctx.font = 'bold 13px Nunito, Arial'; ctx.textAlign = 'left'; ctx.fillText(text.toUpperCase(), 44, y); }
function dataRow(ctx, label, value, W, y) { ctx.fillStyle = '#9090B0'; ctx.font = '12px Nunito, Arial'; ctx.textAlign = 'left'; ctx.fillText(label, 44, y); ctx.fillStyle = '#141252'; ctx.font = 'bold 14px Nunito, Arial'; ctx.textAlign = 'right'; ctx.fillText(value, W-44, y); }

function compressImage(file, callback, quality = 0.6) {
if (!file || !file.type.match('image.*')) {
const reader = new FileReader();
reader.onload = e => callback({ name: file.name, type: file.type, data: e.target.result });
reader.readAsDataURL(file);
return;
}
const reader = new FileReader();
reader.onload = function(event) {
const img = new Image();
img.onload = function() {
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const maxWidth = 1024;
const maxHeight = 1024;
let width = img.width;
let height = img.height;
if (width > height) {
if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
} else {
if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
}
canvas.width = width;
canvas.height = height;
ctx.drawImage(img, 0, 0, width, height);
const dataUrl = canvas.toDataURL('image/jpeg', quality);
callback({ name: file.name.replace(/\.[^/.]+$/, '.jpg'), type: 'image/jpeg', data: dataUrl });
};
img.onerror = () => {
const reader2 = new FileReader();
reader2.onload = e => callback({ name: file.name, type: file.type, data: e.target.result });
reader2.readAsDataURL(file);
};
img.src = event.target.result;
};
reader.readAsDataURL(file);
}

function readFileAsBase64(file,cb){ compressImage(file, cb); }

function vMultas(){

const pagadas=multas.filter(m=>m.estado==='Pagada').reduce((s,m)=>s+m.monto,0);

const seisMesesAtras=new Date(fechaCreacion); seisMesesAtras.setMonth(seisMesesAtras.getMonth()-6);
return (appData.multas||[]).filter(m=>

return `<div class="page-title">Multas</div><div class="page-sub">Gestión de infracciones al reglamento</div>${monthTabs()}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">

${isAdmin?`<button class="btn btn-danger" onclick="openNuevaMulta()">+ Nueva Multa</button>`:''}
</div>
<div class="card">${multas.length===0?`<div style="text-align:center;padding:28px;color:var(--text3)">Sin multas en ${MESES[currentMonth]}</div>`:`
<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Dpto</th><th>Encargado</th><th>Regla</th><th>Monto</th><th>Estado</th><th style="width:200px;"></th></tr></thead><tbody>
${multas.map(m=>{
const depto=(appData.departamentos||[]).find(d=>d.id===m.unidad_id)||{};
const recurrente=getRecurrente(m.unidad_id,m.regla,m.fecha_creacion);
const badgeEstado=m.estado==='Pagada'?'badge-green':(m.estado==='Anulada'?'badge-navy':'badge-red');
return `<tr>
<td>${m.fecha_creacion}</td>
<td><strong style="color:var(--navy)">${depto.numero||m.unidad_id}</strong></td>
<td>${depto.representante||'—'}</td>
<td><span class="badge badge-orange">${m.regla}</span>${recurrente?' <span title="Reincidente">⚠️</span>':''}</td>
<td><strong>${fmt(m.monto)}</strong></td>
<td><span class="badge ${badgeEstado}">${m.estado}</span></td>
<td style="white-space:nowrap;">
<button class="btn btn-ghost btn-sm" onclick="verMulta(${m.id})">👁</button>
<button class="btn btn-outline btn-sm" onclick="descargarVoucherMulta(${m.id})">📥</button>
${m.estado!=='Pagada'&&isAdmin?`<button class="btn btn-success btn-sm" onclick="marcarPagadaMulta(${m.id})">💳</button>`:''}
${isAdmin?`<button class="btn btn-warning btn-sm" onclick="editarMulta(${m.id})">✎</button><button class="btn btn-danger btn-sm" onclick="eliminarMulta(${m.id})">✕</button>`:''}
</td>
</tr>`;
}).join('')}
</tbody></table></div>`}</div>
${pagadas>0&&!state.isTransparencia?`<div style="font-size:11px;color:var(--text3);margin-top:10px;text-align:right;">✓ Este monto se incluye en "Recaudaciones Totales" del Dashboard</div>`:''}`;
}

function cargarDatosDepto(id){
const d=(appData.departamentos||[]).find(x=>x.id==id);
if(d){document.getElementById('nm-encargado').value=d.representante||'';}
else{document.getElementById('nm-encargado').value='';}
}

function crearMulta(){
const {currentYear,currentMonth}=state;
const unidad_id=parseInt(document.getElementById('nm-depto').value);
const regla=document.getElementById('nm-regla').value;
const monto=parseInt(document.getElementById('nm-monto').value)||0;
const motivo=document.getElementById('nm-motivo').value.trim();
const fecha_creacion=document.querySelector('#nm-motivo').closest('.form-row').previousElementSibling.querySelector('input').value;

if(!unidad_id||!monto||monto<=0||!motivo){showToast('Complete los campos requeridos','error');return;}

const depto=(appData.departamentos||[]).find(d=>d.id===unidad_id);
const nuevaMulta={
id:Date.now(),
unidad_id,
encargado:depto?depto.representante:'',
regla,
monto,
motivo,
fecha_creacion,
evidencia_url:null,
estado:'Notificada',
anio:currentYear,
mes:currentMonth,
fecha_pago:null,
creado_por:localStorage.getItem('cbs4_session')?JSON.parse(localStorage.getItem('cbs4_session')).usuario:'admin'
};

const fi=document.getElementById('nm-file');
const pushEvidencia=(archivoData)=>{
if(archivoData)nuevaMulta.evidencia_url=archivoData;
if(!appData.multas)appData.multas=[];
appData.multas.push(nuevaMulta);
saveData();
closeModal();
renderView();
showToast('Multa creada ✓','success');
setTimeout(()=>descargarVoucherMulta(nuevaMulta.id),300);
};

if(fi&&fi.files.length>0){compressImage(fi.files[0],pushEvidencia);}
else{pushEvidencia(null);}
}

function actualizarMulta(id){
const unidad_id=parseInt(document.getElementById('nm-depto').value);
const regla=document.getElementById('nm-regla').value;
const monto=parseInt(document.getElementById('nm-monto').value)||0;
const motivo=document.getElementById('nm-motivo').value.trim();
const fechaInput=document.querySelector('#nm-motivo').closest('.form-row').previousElementSibling.querySelector('input');
const fecha_creacion=fechaInput.value;

if(!unidad_id||!monto||monto<=0||!motivo){showToast('Complete los campos requeridos','error');return;}

const multa=(appData.multas||[]).find(m=>m.id===id);
if(!multa){showToast('Multa no encontrada','error');return;}

const depto=(appData.departamentos||[]).find(d=>d.id===unidad_id);
multa.unidad_id=unidad_id;
multa.encargado=depto?depto.representante:'';
multa.regla=regla;
multa.monto=monto;
multa.motivo=motivo;
multa.fecha_creacion=fecha_creacion;

const fi=document.getElementById('nm-file');
const pushEvidencia=(archivoData)=>{
if(archivoData)multa.evidencia_url=archivoData;
saveData();
closeModal();
renderView();
showToast('Multa actualizada ✓','success');
};

if(fi&&fi.files.length>0){compressImage(fi.files[0],pushEvidencia);}
else{pushEvidencia(null);}
}

function editarMulta(id){
  openNuevaMulta(id);
}

function eliminarMulta(id){
if(!confirm('¿Está seguro que desea ELIMINAR esta multa? Esta acción no se puede deshacer.'))return;
const idx=(appData.multas||[]).findIndex(m=>m.id===id);
if(idx===-1){showToast('Multa no encontrada','error');return;}
appData.multas.splice(idx,1);
saveData();
renderView();
showToast('Multa eliminada','success');
}

function descargarVoucherMulta(id){
const multa=(appData.multas||[]).find(m=>m.id===id);
if(!multa)return;
const depto=(appData.departamentos||[]).find(d=>d.id===multa.unidad_id)||{};
const fechaStr=new Date(multa.fecha_creacion).toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
const W=600,H=multa.evidencia_url?980:780;
const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');

ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
const grad=ctx.createLinearGradient(0,0,W,0);grad.addColorStop(0,'#141252');grad.addColorStop(1,'#2D2A8E');
ctx.fillStyle=grad;ctx.fillRect(0,0,W,140);
ctx.fillStyle='#E8E6FF';ctx.beginPath();ctx.arc(W/2,70,40,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#1E1B6E';ctx.font='bold 14px Nunito, Arial';ctx.textAlign='center';ctx.fillText('CBS4',W/2,75);
ctx.fillStyle='#FFFFFF';ctx.font='bold 15px Nunito, Arial';ctx.fillText('NOTIFICACIÓN OFICIAL DE MULTA',W/2,125);
ctx.fillStyle=multa.estado==='Pagada'?'#4A7C59':'#E05252';roundRect(ctx,W/2-50,140,100,32,16);ctx.fill();
ctx.fillStyle='#FFFFFF';ctx.font='bold 14px Nunito, Arial';ctx.fillText(multa.estado.toUpperCase(),W/2,162);
ctx.strokeStyle='#E8E8F0';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(40,190);ctx.lineTo(W-40,190);ctx.stroke();

let y=230;
ctx.fillStyle='#1E1B6E';ctx.font='bold 13px Nunito, Arial';ctx.textAlign='left';ctx.fillText('DEPARTAMENTO',40,y);y+=30;
ctx.fillStyle='#9090B0';ctx.font='12px Nunito, Arial';ctx.fillText('N° Departamento',40,y);ctx.fillStyle='#141252';ctx.font='bold 14px Nunito, Arial';ctx.textAlign='right';ctx.fillText(depto.numero||multa.unidad_id,W-40,y);y+=35;
ctx.fillStyle='#9090B0';ctx.font='12px Nunito, Arial';ctx.textAlign='left';ctx.fillText('Encargado',40,y);ctx.fillStyle='#141252';ctx.font='bold 14px Nunito, Arial';ctx.textAlign='right';ctx.fillText(multa.encargado||'—',W-40,y);y+=45;
ctx.strokeStyle='#E8E8F0';ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-40,y);ctx.stroke();y+=25;
ctx.fillStyle='#1E1B6E';ctx.font='bold 13px Nunito, Arial';ctx.textAlign='left';ctx.fillText('DETALLE DE INFRACCIÓN',40,y);y+=30;
ctx.fillStyle='#9090B0';ctx.font='12px Nunito, Arial';ctx.fillText('Regla infringida',40,y);ctx.fillStyle='#141252';ctx.font='bold 14px Nunito, Arial';ctx.textAlign='right';ctx.fillText(multa.regla,W-40,y);y+=35;
ctx.fillStyle='#9090B0';ctx.font='12px Nunito, Arial';ctx.textAlign='left';ctx.fillText('Motivo',40,y);ctx.fillStyle='#141252';ctx.font='13px Nunito, Arial';ctx.textAlign='right';
const motivoLines=(multa.motivo.match(/.{1,60}/g)||[]);motivoLines.forEach(line=>{ctx.fillText(line,W-40,y);y+=20;});y+=15;
ctx.fillStyle='#9090B0';ctx.font='12px Nunito, Arial';ctx.textAlign='left';ctx.fillText('Fecha creación',40,y);ctx.fillStyle='#141252';ctx.font='bold 14px Nunito, Arial';ctx.textAlign='right';ctx.fillText(fechaStr,W-40,y);y+=45;
ctx.strokeStyle='#E8E8F0';ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-40,y);ctx.stroke();y+=25;
ctx.fillStyle='#1E1B6E';ctx.font='bold 13px Nunito, Arial';ctx.textAlign='left';ctx.fillText('MONTO',40,y);y+=30;
ctx.fillStyle='#4A7C59';ctx.font='bold 28px Nunito, Arial';ctx.textAlign='right';ctx.fillText(fmt(multa.monto),W-40,y);y+=60;

if(multa.evidencia_url){
ctx.strokeStyle='#E8E8F0';ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-40,y);ctx.stroke();y+=25;
ctx.fillStyle='#1E1B6E';ctx.font='bold 13px Nunito, Arial';ctx.textAlign='left';ctx.fillText('EVIDENCIA ADJUNTA',40,y);y+=30;
ctx.fillStyle='#9090B0';ctx.font='11px Nunito, Arial';ctx.textAlign='center';ctx.fillText('Se adjunta evidencia fotográfica o documental de la infracción',W/2,y);y+=15;
const img=new Image();
img.onload=function(){
const imgW=400;const imgH=250;const imgX=(W-imgW)/2;
ctx.drawImage(img,imgX,y,imgW,imgH);
ctx.fillStyle='#9090B0';ctx.font='10px Nunito, Arial';ctx.textAlign='center';
ctx.fillText('Documento generado automáticamente · Condominio Bosques del Sur 4',W/2,H-40);
ctx.fillText('ID Multa: #'+multa.id, W/2, H-22);
const url=canvas.toDataURL('image/jpeg',0.95);
mostrarVoucherMulta(url,multa,depto);
};
img.onerror=function(){
ctx.fillStyle='#9090B0';ctx.font='11px Nunito, Arial';ctx.textAlign='center';
ctx.fillText('Documento generado automáticamente · Condominio Bosques del Sur 4',W/2,H-40);
ctx.fillText('ID Multa: #'+multa.id, W/2, H-22);
const url=canvas.toDataURL('image/jpeg',0.95);
mostrarVoucherMulta(url,multa,depto);
};
img.src=multa.evidencia_url.data||multa.evidencia_url;
}else{
ctx.fillStyle='#9090B0';ctx.font='11px Nunito, Arial';ctx.textAlign='center';
ctx.fillText('Documento generado automáticamente · Condominio Bosques del Sur 4',W/2,H-40);
ctx.fillText('ID Multa: #'+multa.id, W/2, H-22);
const url=canvas.toDataURL('image/jpeg',0.95);
mostrarVoucherMulta(url,multa,depto);
}
}

<strong>Monto:</strong> ${fmt(m.monto)}<br>
<strong>Estado:</strong> <span class="badge ${m.estado==='Pagada'?'badge-green':'badge-red'}">${m.estado}</span><br>
${m.evidencia_url?`<strong>Evidencia:</strong> <button class="btn btn-ghost btn-sm" onclick="verArchivoMulta(${m.id})">📎 Ver adjunto</button><br>`:''}
</div>
<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
<button class="btn btn-outline" onclick="descargarVoucherMulta(${m.id})">📥 Voucher</button>
${m.estado!=='Pagada'&&!state.isTransparencia?`<button class="btn btn-success" onclick="marcarPagadaMulta(${m.id})">💳 Marcar Pagada</button>`:''}
${!state.isTransparencia?`<button class="btn btn-warning" onclick="closeModal();editarMulta(${m.id})">✎ Editar</button><button class="btn btn-danger" onclick="eliminarMulta(${m.id})">✕ Eliminar</button>`:''}
<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
</div></div></div>`;
}

function verArchivoMulta(id){
const m=(appData.multas||[]).find(x=>x.id===id);
if(!m||!m.evidencia_url)return;
const isImg=m.evidencia_url.type&&m.evidencia_url.type.startsWith('image/');
document.getElementById('modal-area').innerHTML=`<div class="modal-overlay open" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:580px;"><div class="modal-title">📎 Evidencia</div>${isImg?`<img src="${m.evidencia_url.data}" style="width:100%;border-radius:8px;margin-bottom:12px"/>`:'<div style="padding:20px;text-align:center;color:var(--text3)">📄 Archivo adjunto</div>'}<button class="btn btn-ghost" onclick="closeModal()" style="width:100%;margin-top:8px;">Cerrar</button></div></div>`;
}

function marcarPagadaMulta(id){
if(!confirm('¿Marcar esta multa como PAGADA?'))return;
const m=(appData.multas||[]).find(x=>x.id===id);if(!m)return;
m.estado='Pagada';m.fecha_pago=new Date().toISOString().split('T')[0];
saveData();renderView();showToast('Multa marcada como pagada ✓','success');
}

document.addEventListener('DOMContentLoaded', async () => {
document.getElementById('logo-login').src = LOGO_SRC;
document.getElementById('topbar-logo').src = LOGO_SRC;
initFirebase();
initParticles();

const sesionUsuario = checkSession();
if (sesionUsuario && ADMINS.some(a => a.u === sesionUsuario)) {
state.loggedIn = true; state.isTransparencia = false;
const waitShow = setInterval(() => { if (document.getElementById('loading-overlay').style.display === 'none') { clearInterval(waitShow); showApp(); showToast('Sesión activa — bienvenido ✓','success'); } }, 200);
return;
}

const params = new URLSearchParams(window.location.search); if (params.get('vista') === 'transparencia') { enterTransparencia(); return; }

renderLoginScreen();
});
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').then(reg => console.log('SW registered:', reg.scope)).catch(err => console.log('SW error:', err)); }); }
</script>
</body>
