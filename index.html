<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0E7490">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CBS4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Condominio Bosques del Sur 4</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{--navy:#155E75;--navy-light:#0E7490;--navy-dark:#164E63;--green:#10b981;--green-light:#34d399;--green-pale:#d1fae5;--cream:#FAFAFA;--white:#FFFFFF;--gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;--gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;--danger:#EF4444;--warning:#F59E0B;--bg:#F8FAFC;--surface:#FFFFFF;--surface2:#F1F5F9;--border:#E2E8F0;--text:#0F172A;--text2:#475569;--text3:#94A3B8;--topbar-bg:#FFFFFF;--shadow-sm:0 1px 2px 0 rgba(15,23,42,0.05);--shadow:0 1px 3px 0 rgba(15,23,42,0.1),0 1px 2px -1px rgba(15,23,42,0.1);--shadow-md:0 4px 6px -1px rgba(15,23,42,0.1),0 2px 4px -2px rgba(15,23,42,0.1);--shadow-lg:0 10px 15px -3px rgba(15,23,42,0.08),0 4px 6px -4px rgba(15,23,42,0.05);--glass-bg:rgba(255,255,255,0.8);--glass-border:rgba(15,23,42,0.06);--accent:#06B6D4;--accent-2:#2DD4BF;--accent-deep:#0891B2;--accent-dark:#0E7490;}
[data-theme="dark"]{--bg:#0B1220;--surface:#101828;--surface2:#182236;--border:#24324A;--text:#F1F5F9;--text2:#CBD5E1;--text3:#64748B;--topbar-bg:#0B1220;--shadow-sm:0 1px 2px 0 rgba(0,0,0,0.3);--shadow:0 1px 3px 0 rgba(0,0,0,0.4),0 1px 2px -1px rgba(0,0,0,0.4);--shadow-md:0 4px 6px -1px rgba(0,0,0,0.4),0 2px 4px -2px rgba(0,0,0,0.4);--shadow-lg:0 10px 15px -3px rgba(0,0,0,0.5),0 4px 6px -4px rgba(0,0,0,0.4);--glass-bg:rgba(16,24,40,0.8);--glass-border:rgba(255,255,255,0.06);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}
#bg-particles{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;}
[data-theme="dark"] #bg-particles{opacity:.6;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0B1220 0%,#164E63 50%,#0E7490 100%);}
.login-card{background:var(--glass-bg);border-radius:24px;padding:40px 32px;width:380px;max-width:95vw;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);text-align:center;border:1px solid var(--glass-border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:relative;}
.login-card::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(6,182,212,.45),rgba(45,212,191,.45));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.logo-circ{width:100px;height:100px;margin:0 auto 14px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.2);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.logo-circ img{width:100%;height:100%;object-fit:cover;}
.login-title{font-family:'Playfair Display',serif;color:#fff;font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:.5px;}
.login-sub{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:28px;}
.login-label{display:block;text-align:left;font-size:11px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.login-input{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.15);border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:all .2s ease;margin-bottom:14px;background:rgba(255,255,255,.08);color:#fff;}
.login-input::placeholder{color:rgba(255,255,255,.4);}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.2);}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#fff;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(6,182,212,.35);}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(6,182,212,.45);}
.login-btn:active{transform:translateY(0);}
.login-error{color:#FCA5A5;font-size:13px;margin-top:8px;min-height:18px;}
.transp-link{margin-top:18px;}
.transp-link a{color:rgba(255,255,255,.7);font-size:13px;text-decoration:none;font-weight:500;transition:color .2s;}
.transp-link a:hover{color:#fff;}
#app{display:none;min-height:100vh;flex-direction:column;}
.topbar{background:var(--topbar-bg);color:var(--text);padding:0 20px;display:flex;align-items:center;height:64px;gap:14px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);}
.topbar-logo{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid var(--border);}
.topbar-logo img{width:100%;height:100%;object-fit:cover;}
.topbar-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;flex:1;color:var(--text);}
.topbar-sub{font-size:11px;color:var(--text3);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.year-sel{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;outline:none;cursor:pointer;transition:all .2s;font-weight:500;}
.year-sel:hover,.year-sel:focus{border-color:var(--accent);}
.icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;}
.icon-btn:hover{background:var(--surface2);color:var(--accent);}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
.logout-btn:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
.badge-admin{background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#fff;font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;}
.badge-view{background:var(--surface2);color:var(--text2);font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;border:1px solid var(--border);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;margin-right:2px;transition:all .3s;}
.sync-dot.off{background:#EF4444;}
.sync-dot.loading{background:#F59E0B;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.1);}}
.transp-banner{background:linear-gradient(90deg,rgba(6,182,212,.1),rgba(45,212,191,.1));color:var(--text);padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.transp-banner a{color:var(--accent-deep);text-decoration:none;font-weight:600;transition:all .2s;}
[data-theme="dark"] .transp-banner a{color:var(--accent);}
.transp-banner a:hover{text-decoration:underline;}
.bank-banner{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
.bank-banner::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent-deep),var(--accent-2));}
.bank-banner-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:#fff;}
.bank-banner-body{flex:1;min-width:0;}
.bank-banner-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.bank-banner-details{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text);align-items:center;}
.bank-banner-details strong{color:var(--text);font-weight:600;}
.bank-banner-detail{display:flex;align-items:center;gap:5px;}
.bank-banner-detail-label{color:var(--text3);font-size:11px;}
.bank-banner-copy{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .2s;flex-shrink:0;font-weight:600;}
.bank-banner-copy:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.info-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;transition:all .2s ease;box-shadow:var(--shadow-sm);}
.info-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent);}
.info-card-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#fff;}
.info-card-body{flex:1;min-width:0;}
.info-card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3;}
.info-card-desc{font-size:11px;color:var(--text3);line-height:1.4;}
.info-card-arrow{color:var(--accent);font-size:18px;flex-shrink:0;transition:transform .2s;font-weight:300;}
.info-card:hover .info-card-arrow{transform:translateX(4px);}
.section-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-label::before{content:'';width:24px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent-deep),var(--accent-2));}
.section-label.first{margin-top:8px;}
.app-body{display:flex;flex:1;}
.sidebar{width:220px;min-height:calc(100vh - 64px);background:var(--surface);border-right:1px solid var(--border);padding:14px 0;flex-shrink:0;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .2s ease;border-left:3px solid transparent;margin-bottom:1px;position:relative;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--surface2);color:var(--accent-deep);border-left-color:var(--accent);font-weight:600;}
[data-theme="dark"] .nav-item.active{color:var(--accent);border-left-color:var(--accent);}
.nav-sep{height:1px;background:var(--border);margin:10px 14px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:8px 18px 4px;font-weight:600;}
.main{flex:1;padding:24px;overflow-y:auto;max-height:calc(100vh - 64px);}
.page-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin-bottom:4px;color:var(--text);position:relative;padding-bottom:12px;}
.page-title::after{content:'';position:absolute;bottom:0;left:0;width:40px;height:3px;background:linear-gradient(90deg,var(--accent-deep),var(--accent-2));border-radius:3px;}
.page-sub{color:var(--text3);font-size:13px;margin-bottom:24px;padding-left:0;}
.card{background:var(--surface);border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:all .2s ease;position:relative;overflow:hidden;}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border);}
.card-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--text);margin-bottom:16px;font-weight:600;}
@keyframes riseIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#main-content .stat-card{animation:riseIn .4s ease backwards;}
#main-content .stat-card:nth-child(2){animation-delay:.05s;}
#main-content .stat-card:nth-child(3){animation-delay:.1s;}
#main-content .stat-card:nth-child(4){animation-delay:.15s;}
#main-content .stat-card:nth-child(5){animation-delay:.2s;}
#main-content .card{animation:riseIn .4s ease backwards;}
#main-content .charts-grid .card:nth-child(2){animation-delay:.08s;}
.holo-wrap{position:relative;border-radius:10px;overflow:hidden;}
.holo-wrap::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:220% 100%;animation:holoSweep 3s ease-in-out infinite;}
@keyframes holoSweep{0%{background-position:130% 0;}100%{background-position:-130% 0;}}
.month-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.month-tab{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--text3);transition:all .2s ease;background:var(--surface);}
.month-tab:hover{border-color:var(--accent);color:var(--accent-deep);}
.month-tab.active{background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(6,182,212,.3);}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:transform .2s ease,box-shadow .2s ease;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-card.hero{background:linear-gradient(135deg,#0E7490 0%,#0891B2 50%,#2DD4BF 100%);color:#fff;border:none;box-shadow:0 8px 24px rgba(6,182,212,.3);position:relative;overflow:hidden;}
.stat-card.hero::before{content:'';position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%;}
.stat-card.hero::after{content:'';position:absolute;bottom:-30px;left:-10px;width:100px;height:100px;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);border-radius:50%;}
.stat-card.hero .stat-label{color:rgba(255,255,255,.85);letter-spacing:.08em;}
.stat-card.hero .stat-value{color:#fff;}
.stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.stat-value{font-size:24px;font-weight:700;color:var(--text);line-height:1.1;}
.stat-value.small{font-size:18px;}
.stat-meta{font-size:11px;color:var(--text3);margin-top:3px;}
.stat-icon{font-size:14px;}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
canvas{max-height:200px;}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px 14px;background:var(--surface2);color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid transparent;}
.badge-green{background:rgba(16,185,129,.12);color:var(--green);border-color:rgba(16,185,129,.3);}
.badge-red{background:rgba(239,68,68,.1);color:var(--danger);border-color:rgba(239,68,68,.3);}
.badge-orange{background:rgba(245,158,11,.1);color:var(--warning);border-color:rgba(245,158,11,.3);}
.badge-navy{background:var(--surface2);color:var(--text2);border-color:var(--border);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s ease;position:relative;text-decoration:none;}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));color:#fff;border:1px solid transparent;box-shadow:0 2px 8px rgba(6,182,212,.25);}
.btn-primary:hover{box-shadow:0 4px 14px rgba(6,182,212,.35);}
.btn-success{background:var(--green);color:#fff;border:1px solid transparent;}
.btn-success:hover{background:#059669;}
.btn-danger{background:var(--danger);color:#fff;border:1px solid transparent;}
.btn-danger:hover{background:#DC2626;}
.btn-warning{background:var(--warning);color:#fff;border:1px solid transparent;}
.btn-warning:hover{background:#D97706;}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:7px;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent-deep);background:rgba(6,182,212,.05);}
[data-theme="dark"] .btn-outline:hover{color:var(--accent);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.form-row{display:grid;gap:12px;margin-bottom:12px;}
.form-row-2{grid-template-columns:1fr 1fr;}
label.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
input.fi,select.fi,textarea.fi{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:all .2s ease;background:var(--surface);color:var(--text);}
input.fi:focus,select.fi:focus,textarea.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.12);}
.depto-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.depto-cell{background:var(--surface2);border-radius:10px;padding:11px 6px;text-align:center;transition:all .2s ease;border:1px solid transparent;position:relative;}
.depto-cell.clickable{cursor:pointer;}
.depto-cell.clickable:hover{border-color:var(--accent);transform:scale(1.03);}
.depto-cell.paid{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);}
.depto-num{font-size:16px;font-weight:700;color:var(--text);}
.depto-name{font-size:10px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.depto-status{font-size:10px;font-weight:600;margin-top:4px;}
.paid .depto-status{color:var(--green);}
.depto-cell:not(.paid) .depto-status{color:var(--danger);}
.prog-bar{background:var(--surface2);border-radius:99px;height:10px;overflow:hidden;border:1px solid var(--border);}
.prog-fill{height:100%;border-radius:99px;transition:width .5s ease;background:linear-gradient(90deg,var(--accent-deep),var(--accent-2));}
.file-drop{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all .2s ease;color:var(--text3);font-size:12px;background:var(--surface);}
.file-drop:hover{border-color:var(--accent);background:rgba(6,182,212,.04);color:var(--accent-deep);}
.file-preview{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-radius:8px;font-size:12px;margin-top:8px;border:1px solid var(--border);}
.file-preview .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2);border:1px solid var(--border);animation:modalIn .25s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--text);margin-bottom:18px;font-weight:700;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);color:var(--text);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.15);transform:translateY(100px);opacity:0;transition:all .3s ease;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-left:4px solid var(--green);}
.toast.error{border-left:4px solid var(--danger);}
.switch{position:relative;width:44px;height:24px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:.3s;}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
input:checked+.slider{background:linear-gradient(135deg,var(--accent-deep),var(--accent-2));}
input:checked+.slider:before{transform:translateX(20px);}
.donut-wrap{position:relative;width:160px;height:160px;margin:0 auto;}
.donut-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-pct{font-size:28px;font-weight:700;color:var(--text);}
.donut-sub{font-size:11px;color:var(--text3);}
.config-section-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border-radius:8px;margin-bottom:6px;font-size:13px;transition:all .2s;border:1px solid var(--border);}
.history-item:hover{border-color:var(--accent);transform:translateX(2px);}
.share-box{background:var(--surface);border-radius:12px;padding:16px;border:1px solid var(--border);}
.share-url{font-family:monospace;font-size:11px;color:var(--text2);word-break:break-all;margin:8px 0;background:var(--surface2);padding:8px;border-radius:6px;border:1px solid var(--border);}
.loading-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#0B1220,#164E63);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{color:#fff;font-size:15px;font-weight:500;letter-spacing:.5px;opacity:.9;}
.mt-16{margin-top:16px;}.mb-16{margin-bottom:16px;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--text3);}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--text);font-size:24px;line-height:1;margin-right:4px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(3px);z-index:9000;opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-overlay.open{opacity:1;pointer-events:all;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--surface);z-index:9001;transform:translateX(-100%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:4px 0 30px rgba(0,0,0,.15);border-right:1px solid var(--border);}
.drawer.open{transform:translateX(0);}
.drawer-header{background:linear-gradient(135deg,var(--accent-dark),var(--accent-2));padding:20px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;color:#fff;}
.drawer-logo{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.3);}
.drawer-logo img{width:100%;height:100%;object-fit:cover;}
.drawer-title{color:#fff;font-family:'Playfair Display',serif;font-size:14px;font-weight:700;line-height:1.3;}
.drawer-sub{color:rgba(255,255,255,.8);font-size:11px;margin-top:2px;}
.drawer-close{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.drawer-close:hover{background:rgba(255,255,255,.25);}
.drawer-nav{flex:1;overflow-y:auto;padding:10px 0;}
.drawer-nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:12px 16px 4px;font-weight:600;}
.drawer-nav-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;color:var(--text2);font-size:14px;font-weight:500;transition:all .2s ease;border-left:3px solid transparent;}
.drawer-nav-item:hover{background:var(--surface2);color:var(--text);}
.drawer-nav-item.active{background:var(--surface2);color:var(--accent-deep);border-left-color:var(--accent);font-weight:600;}
[data-theme="dark"] .drawer-nav-item.active{color:var(--accent);border-left-color:var(--accent);}
.drawer-nav-sep{height:1px;background:var(--border);margin:8px 14px;}
.drawer-nav-icon{font-size:20px;width:26px;text-align:center;}
.drawer-footer{padding:14px 16px;border-top:1px solid var(--border);flex-shrink:0;}
.drawer-footer-info{font-size:12px;color:var(--text3);margin-bottom:10px;}
.drawer-logout{width:100%;padding:10px;background:var(--danger);color:#fff;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.drawer-logout:hover{background:#DC2626;}
@media(max-width:700px){.info-cards-grid{grid-template-columns:1fr;}.stats-grid{grid-template-columns:1fr 1fr;}.charts-grid{grid-template-columns:1fr;}.depto-grid{grid-template-columns:repeat(3,1fr);}.sidebar{display:none;}.hamburger{display:flex;align-items:center;justify-content:center;}.main{padding:16px;padding-bottom:80px;}.form-row-2{grid-template-columns:1fr;}.stat-value.small{font-size:15px;}.topbar-sub{display:none;}.bank-banner-details{gap:8px;}.bottom-nav{display:block;}}
@media print{#bg-particles{display:none!important;}.sidebar,.topbar,.bottom-nav,.transp-banner,.btn,.month-tabs{display:none!important;}.main{padding:0;max-height:none;}.app-body{display:block;}body{background:white;color:black;}.card,.stat-card{box-shadow:none;border:1px solid #ddd;break-inside:avoid;background:#fff;animation:none;}}
</style>
</head>
<body>
<canvas id="bg-particles"></canvas>
<div id="loading-overlay" class="loading-overlay"><div class="spinner"></div><div class="loading-text">Conectando con Firebase...</div></div>
<div id="login-screen" style="display:none">
<div class="login-card">
<div class="logo-circ"><img id="logo-login" alt="Logo"/></div>
<div class="login-title">CONDOMINIO<br>BOSQUES DEL SUR 4</div>
<div class="login-sub" id="login-sub-text">Panel de Administración</div>
<div id="login-form-area">
<label class="login-label">Usuario</label>
<input class="login-input" id="usr" type="text" placeholder="I.arelluna" onkeydown="if(event.key==='Enter')doLogin()"/>
<label class="login-label">Contraseña</label>
<input class="login-input" id="pwd" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
<button class="login-btn" onclick="doLogin()">Ingresar al Sistema</button>
</div>
<div id="biometric-area" style="display:none;margin-bottom:14px;">
<button class="login-btn" style="font-size:16px;" onclick="loginConHuella()">👆 Ingresar con huella</button>
<div style="margin-top:10px;"><a href="#" style="color:rgba(255,255,255,.7);font-size:12px;" onclick="showPasswordForm();return false;">Usar contraseña</a></div>
</div>
<div class="login-error" id="login-err"></div>
<div class="transp-link"><a href="#" onclick="enterTransparencia();return false;">👁 Vista Transparencia (residentes)</a></div>
</div>
</div>
<div id="app">
<div id="transp-banner-el" class="transp-banner" style="display:none">👁 Vista Transparencia — Solo lectura para residentes &nbsp;|&nbsp;<a href="#" onclick="backToLogin();return false;">← Volver</a></div>
<div class="topbar">
<button class="hamburger" onclick="openDrawer()" aria-label="Menú">☰</button>
<div class="topbar-logo"><img id="topbar-logo" alt="Logo"/></div>
<div><div class="topbar-title">Bosques del Sur 4</div><div class="topbar-sub">Gestión de Condominio</div></div>
<div style="flex:1"></div>
<div class="topbar-right">
<span id="sync-indicator" title="Estado sincronización" style="font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px;"><span class="sync-dot loading" id="sync-dot"></span><span id="sync-text">Conectando</span></span>
<select class="year-sel" id="year-sel" onchange="changeYear(this.value)"></select>
<button class="icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema">🌙</button>
<span id="badge-el" class="badge-admin">Admin</span>
<button class="logout-btn" id="logout-btn" onclick="doLogout()">Salir</button>
</div>
</div>
<div class="app-body">
<div class="sidebar" id="sidebar"></div>
<div class="main" id="main-content"></div>
</div>
</div>
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
<div class="drawer-header">
<div class="drawer-logo"><img id="drawer-logo" alt="Logo"/></div>
<div style="flex:1"><div class="drawer-title">Bosques del Sur 4</div><div class="drawer-sub" id="drawer-sub">Administración</div></div>
<button class="drawer-close" onclick="closeDrawer()">✕</button>
</div>
<div class="drawer-nav" id="drawer-nav"></div>
<div class="drawer-footer" id="drawer-footer"></div>
</div>
<div id="modal-area"></div>
<div class="toast" id="toast-el"></div>
<script>
const firebaseConfig = {
apiKey: "AIzaSyC1UR2UVH7EbvlRwK1Tw9tnW1JgLQMAF2k",
authDomain: "bosques-del-sur-4.firebaseapp.com",
databaseURL: "https://bosques-del-sur-4-default-rtdb.firebaseio.com",
projectId: "bosques-del-sur-4",
storageBucket: "bosques-del-sur-4.firebasestorage.app",
messagingSenderId: "201777693828",
appId: "1:201777693828:web:59371297fdcc14ef3daed1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const LOGO_SRC = 'Timbre La balada.png';
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ADMINS = [{u:'I.arelluna',p:'Arelluna_123',rol:'Administrador'},{u:'R.figueroa',p:'Figueroa_123',rol:'Tesorera'},{u:'T.diaz',p:'Diaz_123',rol:'Presidenta'}];
const DEFAULT_GC = 40000;
const TOTAL_DEPTOS = 18;
const YEARS = [2018,2019,2020,2021,2022,2023,2024,2025,2026,2027,2028];
let state = {loggedIn:false,isTransparencia:false,currentView:'dashboard',currentYear:new Date().getFullYear(),currentMonth:new Date().getMonth(),theme:'light',connected:false,formulariosSortAsc:false,ventanaMorosidad:'12'};
function defaultData(){return {departamentos:Array.from({length:18},(_,i)=>({id:i+1,numero:String(i+1).padStart(2,'0'),representante:'',contacto:''})),pagos:{},ingresosExtra:[],gastosFijos:{},gastosVariables:[],gastoComunHistorial:[{desde:'2022-01',valor:DEFAULT_GC}],configuracion:{tema:'light'},formularios:[],multas:[]};}
let appData = defaultData();
let firebaseListener = null;
let lastVoucher = null;
function initFirebase(){
db.ref('.info/connected').on('value', snap => {state.connected = snap.val() === true;const dot=document.getElementById('sync-dot');const txt=document.getElementById('sync-text');if(dot&&txt){dot.className='sync-dot '+(state.connected?'':'off');txt.textContent=state.connected?'En línea':'Sin conexión';}});
firebaseListener = db.ref('cbs4').on('value', snap => {
const val = snap.val();
if(val){appData = {...defaultData(),...val,departamentos:val.departamentos||defaultData().departamentos,gastosFijos:val.gastosFijos||{},gastosVariables:val.gastosVariables||[],ingresosExtra:val.ingresosExtra||[],pagos:val.pagos||{},gastoComunHistorial:val.gastoComunHistorial||[{desde:'2022-01',valor:DEFAULT_GC}],configuracion:val.configuracion||{tema:'light'},formularios:val.formularios||[],multas:val.multas||[]};}
else {db.ref('cbs4').set(appData);}
const overlay=document.getElementById('loading-overlay');
if(overlay && overlay.style.display!=='none'){overlay.style.display='none';document.getElementById('login-screen').style.display='flex';
if(appData.configuracion&&appData.configuracion.tema==='dark'){state.theme='dark';document.documentElement.setAttribute('data-theme','dark');const b=document.getElementById('theme-btn');if(b)b.textContent='☀️';}}
if(state.loggedIn||state.isTransparencia){renderView();}
});
}
function saveData(){db.ref('cbs4').set(appData).catch(e=>showToast('Error al guardar: '+e.message,'error'));}
function fmt(n){return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);}
function mkKey(y,m){return `${y}-${String(m+1).padStart(2,'0')}`;}
function showToast(msg,type=''){const t=document.getElementById('toast-el');t.textContent=msg;t.className=`toast ${type}`;setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>t.classList.remove('show'),2800);}
function closeModal(){document.getElementById('modal-area').innerHTML='';}
function getGC(anio,mes){const key=mkKey(anio,mes);const hist=(appData.gastoComunHistorial||[{desde:'2022-01',valor:DEFAULT_GC}]).filter(h=>h.desde<=key).sort((a,b)=>b.desde.localeCompare(a.desde));return hist.length>0?hist[0].valor:DEFAULT_GC;}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',state.theme);document.getElementById('theme-btn').textContent=state.theme==='dark'?'☀️':'🌙';if(!appData.configuracion)appData.configuracion={};appData.configuracion.tema=state.theme;saveData();}
function formatPeriodo(key){const [y,m]=key.split('-');return `${MESES[parseInt(m)-1]} ${y}`;}
const SESSION_KEY='cbs4_session';const SESSION_DAYS=7;
function saveSession(u){localStorage.setItem(SESSION_KEY,JSON.stringify({usuario:u,ts:Date.now()}));}
function clearSession(){localStorage.removeItem(SESSION_KEY);localStorage.removeItem('cbs4_biometric_enabled');}
function checkSession(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY));if(!s)return null;const d=(Date.now()-s.ts)/(1000*60*60*24);if(d>SESSION_DAYS){clearSession();return null;}return s.usuario;}catch(e){return null;}}
function isBiometricAvailable(){return window.PublicKeyCredential&&typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable==='function';}
async function biometricAvailable(){if(!isBiometricAvailable())return false;try{return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}catch(e){return false;}}
async function registerBiometric(u){try{const c=new Uint8Array(32);crypto.getRandomValues(c);const uid=new TextEncoder().encode(u);await navigator.credentials.create({publicKey:{challenge:c,rp:{name:'Bosques del Sur 4',id:location.hostname},user:{id:uid,name:u,displayName:u},pubKeyCredParams:[{alg:-7,type:'public-key'}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});localStorage.setItem('cbs4_biometric_enabled',u);showToast('Huella registrada ✓','success');return true;}catch(e){return false;}}
async function verifyBiometric(){const u=localStorage.getItem('cbs4_biometric_enabled');if(!u)return null;try{const c=new Uint8Array(32);crypto.getRandomValues(c);await navigator.credentials.get({publicKey:{challenge:c,timeout:60000,userVerification:'required',rpId:location.hostname}});return u;}catch(e){return null;}}
async function doLogin(){const u=document.getElementById('usr').value.trim();const p=document.getElementById('pwd').value;if(ADMINS.some(a=>a.u===u&&a.p===p)){saveSession(u);state.loggedIn=true;state.isTransparencia=false;showApp();const ok=await biometricAvailable();const be=localStorage.getItem('cbs4_biometric_enabled');if(ok&&!be)setTimeout(()=>offerBiometric(u),800);}else{document.getElementById('login-err').textContent='Credenciales incorrectas.';}}
function offerBiometric(u){document.getElementById('modal-area').innerHTML=`<div class="modal-overlay open"><div class="modal" style="text-align:center;"><div style="font-size:48px;margin-bottom:12px;">👆</div><div class="modal-title" style="text-align:center;">¿Activar acceso con huella?</div><p style="font-size:13px;color:var(--text3);margin-bottom:20px;">La próxima vez podrás entrar usando tu huella digital.</p><div style="display:flex;gap:10px;justify-content:center;"><button class="btn btn-primary" onclick="activarBiometric('${u}')">👆 Activar huella</button><button class="btn btn-ghost" onclick="closeModal()">Ahora no</button></div></div></div>`;}
async function activarBiometric(u){closeModal();showToast('Escanea tu huella...','');await registerBiometric(u);}
async function loginConHuella(){const u=localStorage.getItem('cbs4_biometric_enabled');if(!u)return;if(!ADMINS.some(a=>a.u===u)){localStorage.removeItem('cbs4_biometric_enabled');renderLoginScreen();showToast('Credenciales actualizadas: usa tu contraseña','error');return;}showToast('Verifica tu identidad...','');const r=await verifyBiometric();if(r){saveSession(r);state.loggedIn=true;state.isTransparencia=false;showApp();showToast('Bienvenido '+r+' ✓','success');}else{showToast('Verificación fallida','error');}}
function enterTransparencia(){state.isTransparencia=true;state.loggedIn=false;state.currentView='reportes';showApp();}
function backToLogin(){state.isTransparencia=false;state.loggedIn=false;document.getElementById('app').style.display='none';document.getElementById('login-screen').style.display='flex';renderLoginScreen();}
function doLogout(){clearSession();backToLogin();}
function showApp(){document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('transp-banner-el').style.display=state.isTransparencia?'flex':'none';const c=(ADMINS.find(a=>a.u===checkSession())||{}).rol||'Admin';document.getElementById('badge-el').className=state.isTransparencia?'badge-view':'badge-admin';document.getElementById('badge-el').textContent=state.isTransparencia?'Solo Lectura':c;document.getElementById('logout-btn').style.display=state.isTransparencia?'none':'block';const ys=document.getElementById('year-sel');ys.innerHTML=YEARS.map(y=>`<option value="${y}" ${y===state.currentYear?'selected':''}>${y}</option>`).join('');renderSidebar();renderBNav();renderView();}
const VIEWS_ADMIN=[{id:'dashboard',icon:'🏠',label:'Dashboard'},{id:'gastoComun',icon:'💳',label:'Gasto Común'},{id:'recordatorios',icon:'💬',label:'Recordatorios'},{id:'departamentos',icon:'🏘',label:'Departamentos'},{id:'ingresosExtra',icon:'➕',label:'Ingresos Extra'},{id:'egresos',icon:'💸',label:'Gastos'},{id:'reportes',icon:'📊',label:'Transparencia'},{id:'config',icon:'⚙️',label:'Configuración'},{id:'formularios',icon:'📝',label:'Formulario'},{id:'multas',icon:'⚖️',label:'Multas'}];
const VIEWS_TRANSP=[{id:'reportes',icon:'📊',label:'Reporte'}];
function getViews(){return state.isTransparencia?VIEWS_TRANSP:VIEWS_ADMIN;}
function renderSidebar(){try{document.getElementById('sidebar').innerHTML='<div class="nav-label">Menú</div>'+getViews().map(v=>`<div class="nav-item ${state.currentView===v.id?'active':''}" onclick="goTo('${v.id}')">${v.icon} ${v.label}</div>`).join('');}catch(e){console.error(e);}}
function renderBNav(){renderDrawerNav();}
function renderDrawerNav(){try{const navEl=document.getElementById('drawer-nav');if(!navEl)return;const isAdmin=!state.isTransparencia;let h='';
if(isAdmin){h+='<div class="drawer-nav-label">Principal</div>';h+=navDrawerItem('dashboard','🏠','Dashboard');h+=navDrawerItem('gastoComun','💳','Gasto Común');h+=navDrawerItem('recordatorios','💬','Recordatorios');h+=navDrawerItem('departamentos','🏘','Departamentos');h+='<div class="drawer-nav-sep"></div><div class="drawer-nav-label">Finanzas</div>';h+=navDrawerItem('ingresosExtra','➕','Ingresos Extra');h+=navDrawerItem('egresos','💸','Gastos');h+='<div class="drawer-nav-sep"></div><div class="drawer-nav-label">Reportes y Config</div>';h+=navDrawerItem('reportes','📊','Transparencia');h+=navDrawerItem('config','⚙️','Configuración');h+=navDrawerItem('formularios','📝','Formulario');h+=navDrawerItem('multas','⚖️','Multas');}
else{h+='<div class="drawer-nav-label">Vista Transparencia</div>';h+=navDrawerItem('reportes','📊','Reporte');}
navEl.innerHTML=h;const f=document.getElementById('drawer-footer');
if(f){if(isAdmin)f.innerHTML=`<div class="drawer-footer-info">Sesión activa · Admin</div><button class="drawer-logout" onclick="doLogout();closeDrawer()">Cerrar Sesión</button>`;else f.innerHTML=`<div class="drawer-footer-info">Vista Residentes · Solo lectura</div><button class="drawer-logout" style="background:var(--accent-deep);" onclick="backToLogin();closeDrawer()">← Volver al Login</button>`;}
const s=document.getElementById('drawer-sub');if(s)s.textContent=isAdmin?'Panel de Administración':'Vista Transparencia';}catch(e){console.error(e);}}
function navDrawerItem(id,icon,label){return `<div class="drawer-nav-item ${state.currentView===id?'active':''}" onclick="goTo('${id}');closeDrawer()"><span class="drawer-nav-icon">${icon}</span>${label}</div>`;}
function openDrawer(){try{const o=document.getElementById('drawer-overlay');const d=document.getElementById('drawer');const l=document.getElementById('drawer-logo');if(!o||!d)return;if(l)l.src=LOGO_SRC;renderDrawerNav();o.classList.add('open');d.classList.add('open');document.body.style.overflow='hidden';}catch(e){console.error(e);}}
function closeDrawer(){const o=document.getElementById('drawer-overlay');const d=document.getElementById('drawer');if(o)o.classList.remove('open');if(d)d.classList.remove('open');document.body.style.overflow='';}
function goTo(v){state.currentView=v;renderSidebar();renderBNav();renderView();window.scrollTo(0,0);setTimeout(()=>{window.scrollTo(0,0);},100);}
function changeYear(y){state.currentYear=parseInt(y);renderView();}
function setMonth(m){state.currentMonth=m;renderView();}
function monthTabs(){return '<div class="month-tabs">'+MESES.map((m,i)=>`<div class="month-tab ${i===state.currentMonth?'active':''}" onclick="setMonth(${i})">${m.substring(0,3)}</div>`).join('')+'</div>';}
let charts={};
function killCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}
function animateCounters(){try{document.querySelectorAll('#main-content .stat-value').forEach(el=>{if(el.children.length)return;const o=el.textContent.trim();const d=o.replace(/[^\d]/g,'');if(!d)return;const t=parseInt(d,10);if(isNaN(t)||t<=0)return;const neg=o.indexOf('-')!==-1;const dur=800;const st=performance.now();function fr(t2){const p=Math.min(1,(t2-st)/dur);const e=1-Math.pow(1-p,3);const v=Math.round(t*e);el.textContent=(neg?'-':'')+fmt(v);if(p<1){requestAnimationFrame(fr);}else{el.textContent=o;}}requestAnimationFrame(fr);});}catch(e){}}
function initParticles(){try{const c=document.getElementById('bg-particles');if(!c)return;const ctx=c.getContext('2d');if(!ctx)return;if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;let W,H,pts=[];function rs(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;const n=Math.min(40,Math.floor(W/35));pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.4,c:Math.random()<.5?'8,145,178':'45,212,191'}));}rs();window.addEventListener('resize',rs);(function loop(){ctx.clearRect(0,0,W,H);const dk=document.documentElement.getAttribute('data-theme')==='dark';const b=dk?.35:.2;for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<120*120){const al=(1-Math.sqrt(d)/120)*b*.4;ctx.strokeStyle='rgba(8,145,178,'+al.toFixed(3)+')';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}for(const p of pts){ctx.fillStyle='rgba('+p.c+','+(b*.6).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}requestAnimationFrame(loop);})();}catch(e){}}
function renderView(){killCharts();const el=document.getElementById('main-content');if(!el)return;const v=state.currentView;try{
if(v==='dashboard')el.innerHTML=vDashboard();else if(v==='gastoComun')el.innerHTML=vGastoComun();else if(v==='recordatorios')el.innerHTML=vRecordatorios();else if(v==='departamentos')el.innerHTML=vDepartamentos();else if(v==='ingresosExtra')el.innerHTML=vIngresosExtra();else if(v==='egresos')el.innerHTML=vEgresos();else if(v==='reportes')el.innerHTML=vReportes();else if(v==='config')el.innerHTML=vConfig();else if(v==='formularios')el.innerHTML=vFormularios();else if(v==='multas')el.innerHTML=vMultas();else el.innerHTML='<div style="padding:20px;">Vista no encontrada</div>';
}catch(e){console.error(e);el.innerHTML='<div style="padding:20px;color:var(--danger)">Error al cargar la vista. Recarga la página.</div>';}
setTimeout(drawCharts,100);setTimeout(animateCounters,60);}
function calcularBalanceGeneral(){let t=0;for(let a=2018;a<=2028;a++){for(let m=0;m<12;m++){t+=balanceMes(a,m);}}return t;}
function balanceMes(a,m){const k=mkKey(a,m);const gc=getGC(a,m);const p=appData.pagos[k]||{};const pg=Object.values(p).filter(Boolean).length;const ex=(appData.ingresosExtra||[]).filter(g=>g.anio===a&&g.mes===m).reduce((s,g)=>s+g.monto,0);const mp=(appData.multas||[]).filter(x=>x.anio===a&&x.mes===m&&x.estado==='Pagada').reduce((s,x)=>s+x.monto,0);const fm=(appData.gastosFijos&&appData.gastosFijos[k])?appData.gastosFijos[k]:[];const f=fm.reduce((s,g)=>s+g.monto,0);const va=(appData.gastosVariables||[]).filter(g=>g.anio===a&&g.mes===m).reduce((s,g)=>s+g.monto,0);return (pg*gc+ex+mp)-(f+va);}

function clavesVentana(t){const now=new Date();const k=[];if(t==='12'){for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);k.push(mkKey(d.getFullYear(),d.getMonth()));}k.reverse();}else if(t==='anio'){for(let m=0;m<=now.getMonth();m++){k.push(mkKey(now.getFullYear(),m));}}else{for(let y=2018;y<=now.getFullYear();y++){const l=(y===now.getFullYear())?now.getMonth():11;for(let m=0;m<=l;m++){k.push(mkKey(y,m));}}}return k;}
function calcularMorosidad(){const t=state.ventanaMorosidad||'12';const keys=clavesVentana(t);const out=[];(appData.departamentos||[]).forEach(dep=>{const gcM=[];keys.forEach(k=>{if((appData.pagos[k]||{})[dep.id]!==true){const a=parseInt(k.substring(0,4));const mi=parseInt(k.substring(5,7))-1;gcM.push({key:k,label:formatPeriodo(k),monto:getGC(a,mi)});}});const mul=(appData.multas||[]).filter(m=>{if(m.unidad_id!==dep.id)return false;if(m.estado==='Pagada'||m.estado==='Anulada')return false;const mk=m.anio+'-'+String(m.mes+1).padStart(2,'0');return keys.includes(mk);});const tGC=gcM.reduce((s,g)=>s+g.monto,0);const tM=mul.reduce((s,m)=>s+m.monto,0);const tot=tGC+tM;if(tot>0)out.push({dep,gcMeses:gcM,multas:mul,total:tot});});out.sort((a,b)=>b.total-a.total);return out;}

function recordarMesActual(id){const {currentYear,currentMonth}=state;const d=(appData.departamentos||[]).find(x=>x.id===id);if(!d)return;const gc=getGC(currentYear,currentMonth);const t=`Hola ${d.representante||''} 👋\nCONDOMINIO BOSQUES DEL SUR 4\nLe recordamos que el Gasto Común de ${MESES[currentMonth]} ${currentYear} (${fmt(gc)}) se encuentra pendiente.\n\nDatos de transferencia:\nRomina Gabriela Figueroa Acevedo\nMercado Pago — Cuenta Vista\nN° 1088283442`;abrirWhatsApp(d.contacto||'',t);}
function generarEstadoCuenta(id){const m=calcularMorosidad().find(x=>x.dep.id===id);if(!m)return;const rows=[];m.gcMeses.forEach(g=>rows.push({t:'GC '+g.label,v:g.monto}));m.multas.forEach(x=>rows.push({t:'Multa '+x.fecha_creacion+' · '+x.regla,v:x.monto}));const W=600;const H=420+rows.length*26+80;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#0E7490');g.addColorStop(1,'#2DD4BF');ctx.fillStyle=g;ctx.fillRect(0,0,W,120);ctx.fillStyle='#FFFFFF';ctx.font='bold 18px Inter, Arial';ctx.textAlign='center';ctx.fillText('ESTADO DE CUENTA',W/2,55);ctx.font='500 13px Inter, Arial';ctx.fillText('Condominio Bosques del Sur 4',W/2,80);ctx.fillStyle='#111827';ctx.font='bold 15px Inter, Arial';ctx.textAlign='left';ctx.fillText('Depto '+m.dep.numero+' — '+(m.dep.representante||''),40,160);let y=195;rows.forEach(r=>{ctx.fillStyle='#4B5563';ctx.font='13px Inter, Arial';ctx.textAlign='left';ctx.fillText('• '+r.t,40,y);ctx.textAlign='right';ctx.fillText(fmt(r.v),W-40,y);y+=26;});ctx.strokeStyle='#E5E7EB';ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-40,y);ctx.stroke();y+=32;ctx.fillStyle='#DC2626';ctx.font='bold 18px Inter, Arial';ctx.textAlign='left';ctx.fillText('TOTAL PENDIENTE:',40,y);ctx.textAlign='right';ctx.fillText(fmt(m.total),W-40,y);y+=40;ctx.fillStyle='#9CA3AF';ctx.font='11px Inter, Arial';ctx.textAlign='center';ctx.fillText('Romina Gabriela Figueroa Acevedo · Mercado Pago · Cta Vista N° 1088283442',W/2,y);const img=cv.toDataURL('image/jpeg',0.95);lastVoucher={img,tipo:'estado',depto:m.dep,texto:textoMoroso(m)};document.getElementById('modal-area').innerHTML=`<div class="modal-overlay open" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:560px;"><div class="modal-title">📄 Estado de Cuenta — Depto ${m.dep.numero}</div><div class="holo-wrap" style="margin-bottom:16px;"><img src="${img}" style="width:100%;border-radius:10px;border:1px solid var(--border);"/></div><div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="${img}" download="Estado_Cuenta_Depto_${m.dep.numero}.jpg" class="btn btn-primary">⬇ Descargar JPG</a><button class="btn btn-success" onclick="compartirUltimoVoucher()">📤 Compartir por WhatsApp</button><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div></div></div>`;}
function vRecordatorios(){const t=state.ventanaMorosidad||'12';const mor=calcularMorosidad();const tot=mor.reduce((s,m)=>s+m.total,0);const lv=t==='12'?'Últimos 12 meses':(t==='anio'?'Año en curso':'Todo el historial');
const cards=mor.map(m=>{const gr=m.gcMeses.map(g=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:2px 0;"><span>• ${g.label}</span><span>${fmt(g.monto)}</span></div>`).join('');const mr=m.multas.map(x=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:2px 0;"><span>• ${x.fecha_creacion} · ${x.regla}</span><span>${fmt(x.monto)}</span></div>`).join('');

function togglePago(key,id){if(!appData.pagos)appData.pagos={};if(!appData.pagos[key])appData.pagos[key]={};const n=!appData.pagos[key][id];appData.pagos[key][id]=n;saveData();if(n){showToast('Pago registrado ✓ — generando voucher...','success');setTimeout(()=>generarVoucher(key,id),400);}else{showToast('Pago removido','');}}
function vDepartamentos(){return `<div class="page-title">Departamentos</div><div class="page-sub">18 unidades — Datos de representantes</div><div class="card"><div class="table-wrap"><table><thead><tr><th>Departamento</th><th>Representante</th><th>Contacto</th><th></th></tr></thead><tbody>${(appData.departamentos||[]).map(d=>`<tr><td><strong style="color:var(--text)">${d.numero}</strong></td><td>${d.representante||'<span style="color:var(--text3)">Sin asignar</span>'}</td><td>${d.contacto||'—'}</td><td><button class="btn btn-primary btn-sm" onclick="openDepto(${d.id})">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function openDepto(id){const d=(appData.departamentos||[]).find(x=>x.id===id);document.getElementById('modal-area').innerHTML=`<div class="modal-overlay open" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-title">Editar Departamento</div><div class="form-row"><div><label class="fl">Número / ID</label><input class="fi" id="m-num" value="${d.numero}"/></div></div><div class="form-row"><div><label class="fl">Representante</label><input class="fi" id="m-rep" value="${d.representante}"/></div></div><div class="form-row"><div><label class="fl">Contacto</label><input class="fi" id="m-con" value="${d.contacto}" placeholder="+56 9 XXXX XXXX"/></div></div><div style="display:flex;gap:10px;margin-top:10px;"><button class="btn btn-primary" onclick="saveDepto(${id})">Guardar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div></div></div>`;}
function saveDepto(id){const d=(appData.departamentos||[]).find(x=>x.id===id);d.numero=document.getElementById('m-num').value||d.numero;d.representante=document.getElementById('m-rep').value;d.contacto=document.getElementById('m-con').value;saveData();closeModal();showToast('Guardado ✓','success');renderView();}
function vIngresosExtra(){const {currentYear,currentMonth}=state;const it=(appData.ingresosExtra||[]).filter(x=>x.anio===currentYear&&x.mes===currentMonth);const tot=it.reduce((s,x)=>s+x.monto,0);
return `<div class="page-title">Ingresos Extras</div><div class="page-sub">Rifas, pactos de cuotas, actividades</div>${monthTabs()}<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><div class="stat-card" style="flex:none;padding:12px 18px;"><div class="stat-label">Total ${MESES[currentMonth]}</div><div class="stat-value small">${fmt(tot)}</div></div><button class="btn btn-success" onclick="openNuevoIngreso()">+ Agregar</button></div><div class="card">${it.length===0?`<div style="text-align:center;padding:28px;color:var(--text3)">Sin ingresos extras en ${MESES[currentMonth]}</div>`:`<div class="table-wrap"><table><thead><tr><th>Descripción</th><th>Tipo</th><th>Resumen</th><th>Monto</th><th></th></tr></thead><tbody>${it.map(x=>{let r='-';if(x.tipo==='Pacto Cuotas'&&x.departamentosPagados){r=`<span class="badge badge-navy">${x.departamentosPagados.length}/18 DPTOS</span>`;}return `<tr><td>${x.descripcion}</td><td><span class="badge badge-green">${x.tipo}</span></td><td>${r}</td><td><strong>${fmt(x.monto)}</strong></td><td><button class="btn btn-danger btn-sm" onclick="delIngreso(${x.id})">✕</button>${x.tipo==='Pacto Cuotas'?`<button class="btn btn-outline btn-sm" onclick="openNuevoIngreso(${x.id})">✎</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`}</div>`;}
function openNuevoIngreso(editId=null){let item=editId?(appData.ingresosExtra||[]).find(x=>x.id===editId):null;const {currentYear,currentMonth}=state;const title=item?`Editar: ${item.descripcion}`:`Nuevo Ingreso Extra — ${MESES[currentMonth]}`;const dv=item?item.descripcion:'';const tv=item?item.tipo:'Rifa';const mv=item?item.monto:'';let dc='';let ex=item&&item.departamentosEximidos?[...item.departamentosEximidos]:[];(appData.departamentos||[]).forEach(d=>{const ie=ex.includes(d.id);const ck=!ie&&item&&item.departamentosPagados&&item.departamentosPagados.includes(d.id)?'checked':'';dc+=`<div class="depto-row" id="depto-row-${d.id}" style="margin:4px 0;"><label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:6px 8px;border:1px solid var(--border);border-radius:6px;${ie?'background: var(--surface2);':''}"><input type="checkbox" class="depto-check" data-depto-id="${d.id}" ${ck} ${ie?'disabled':''}><span style="flex:1"><strong>${d.numero}</strong> — ${d.representante||'Sin nombre'}</span>${ie?'<span class="eximido-label" style="color:var(--text3);font-size:11px;">(Eximido)</span>':''}<button type="button" class="btn btn-sm ${ie?'btn-outline':'btn-ghost'}" onclick="eximirDepto(${d.id}, this)">${ie?'Restaurar':'Eximir'}</button></label></div>`;});
document.getElementById('modal-area').innerHTML=`<div class="modal-overlay open" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-title">${title}</div><div class="form-row"><div><label class="fl">Descripción</label><input class="fi" id="ni-d" value="${dv}"/></div></div><div class="form-row form-row-2"><div><label class="fl">Tipo</label><select class="fi" id="ni-t" onchange="toggleIngresoFields()"><option value="Rifa" ${tv==='Rifa'?'selected':''}>Rifa</option><option value="Pacto Cuotas" ${tv==='Pacto Cuotas'?'selected':''}>Pacto Cuotas</option><option value="Actividad" ${tv==='Actividad'?'selected':''}>Actividad</option><option value="Otro" ${tv==='Otro'?'selected':''}>Otro</option></select></div><div id="field-monto"><label class="fl">Monto ($)</label><input class="fi" id="ni-m" type="number" placeholder="0" value="${mv}"/></div></div><div id="field-pacto" style="display:none;"><div class="form-row"><div><label class="fl">Monto por Depto ($)</label><input class="fi" id="ni-m-unit" type="number" placeholder="0" value="${item&&item.montoUnitario?item.montoUnitario:''}"/></div></div><div class="form-row"><label class="fl">Deptos que pagan:</label><div class="depto-grid" id="pacto-deptos">${dc}</div><div style="font-size:11px;color:var(--text3);margin-top:8px;" id="pacto-count">0/18 seleccionados</div></div></div><div style="display:flex;gap:10px;margin-top:10px;"><button class="btn btn-success" onclick="saveIngreso(${editId||'null'})">Guardar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div></div></div>`;
if(item&&item.tipo==='Pacto Cuotas'){document.getElementById('field-monto').style.display='none';document.getElementById('field-pacto').style.display='block';updatePactoCount(item.departamentosPagados?item.departamentosPagados.length:0);}toggleIngresoFields();}
function eximirDepto(id,btn){const row=document.getElementById(`depto-row-${id}`);const lb=row.querySelector('label');const cb=row.querySelector('input[type="checkbox"]');const ie=lb.querySelector('.eximido-label');if(ie){btn.textContent='Eximir';btn.classList.remove('btn-outline');btn.classList.add('btn-ghost');lb.style.backgroundColor='';ie.remove();cb.disabled=false;cb.checked=false;}else{btn.textContent='Restaurar';btn.classList.add('btn-outline');btn.classList.remove('btn-ghost');lb.style.backgroundColor='var(--surface2)';if(!lb.querySelector('.eximido-label')){const s=document.createElement('span');s.className='eximido-label';s.style.cssText='color:var(--text3);font-size:11px;';s.textContent='(Eximido)';lb.insertBefore(s,btn);}cb.disabled=true;cb.checked=false;}updatePactoCount();}
function toggleIngresoFields(){const t=document.getElementById('ni-t').value;const fm=document.getElementById('field-monto');const fp=document.getElementById('field-pacto');if(t==='Pacto Cuotas'){fm.style.display='none';fp.style.display='block';}else{fm.style.display='block';fp.style.display='none';}}
function updatePactoCount(c){const e=document.getElementById('pacto-count');if(e)e.textContent=`${c}/18 seleccionados`;}
function saveIngreso(editId){const {currentYear,currentMonth}=state;const d=document.getElementById('ni-d').value.trim();const t=document.getElementById('ni-t').value;let m=0,mu=0,dp=[],de=[];
if(t==='Pacto Cuotas'){mu=parseInt(document.getElementById('ni-m-unit').value)||0;document.querySelectorAll('.depto-check:checked').forEach(c=>{dp.push(parseInt(c.getAttribute('data-depto-id')||c.value));});document.querySelectorAll('.eximido-label').forEach(el=>{const r=el.closest('.depto-row');const cb=r.querySelector('input[type="checkbox"]');de.push(parseInt(cb.getAttribute('data-depto-id')));});m=mu*dp.length;if(dp.length===0){showToast('Seleccione al menos un departamento','error');return;}}else{m=parseInt(document.getElementById('ni-m').value)||0;}
if(!d||m<=0){showToast('Complete los campos','error');return;}if(!appData.ingresosExtra)appData.ingresosExtra=[];
if(editId){const i=appData.ingresosExtra.findIndex(x=>x.id===editId);if(i!==-1){appData.ingresosExtra[i]={...appData.ingresosExtra[i],descripcion:d,tipo:t,monto:m,montoUnitario:mu,departamentosPagados:dp,departamentosEximidos:de};}}else{appData.ingresosExtra.push({id:Date.now(),anio:currentYear,mes:currentMonth,descripcion:d,tipo:t,monto:m,montoUnitario:mu,departamentosPagados:dp,departamentosEximidos:de});}
saveData();closeModal();renderView();showToast('Registrado ✓','success');}
function delIngreso(id){appData.ingresosExtra=(appData.ingresosExtra||[]).filter(x=>x.id!=id);saveData();renderView();showToast('Eliminado');}
function vEgresos(){const {currentYear,currentMonth}=state;const key=mkKey(currentYear,currentMonth);const va=(appData.gastosVariables||[]).filter(g=>g.anio===currentYear&&g.mes===currentMonth);const fm=(appData.gastosFijos&&appData.gastosFijos[key])?appData.gastosFijos[key]:[];const tF=fm.reduce((s,g)=>s+g.monto,0);const tV=va.reduce((s,g)=>s+g.monto,0);
return `<div class="page-title">Gastos</div><div class="page-sub">Gastos fijos y variables</div>${monthTabs()}<div class="stats-grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px;"><div class="stat-card"><div class="stat-label">Gastos Fijos</div><div class="stat-value small">${fmt(tF)}</div></div><div class="stat-card"><div class="stat-label">Gastos Variables</div><div class="stat-value small">${fmt(tV)}</div></div><div class="stat-card"><div class="stat-label">Total</div><div class="stat-value small">${fmt(tF+tV)}</div></div></div><div class="card mb-16"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div class="card-title" style="margin:0">🔒 Gastos Fijos (${MESES[currentMonth]})</div><button class="btn btn-primary btn-sm" onclick="openNuevoFijo('${key}')">+ Agregar</button></div><div class="table-wrap"><table><thead><tr><th>Descripción</th><th>Monto</th><th>Comprobante</th><th></th></tr></thead><tbody>${fm.map(g=>`<tr><td>${g.descripcion}</td><td><strong>${fmt(g.monto)}</strong></td><td>${g.archivo?`<button class="btn btn-ghost btn-sm" onclick="verArchivo('fijo',${g.id},'${key}')">📎 Ver</button>`:'<span style="color:var(--text3)">—</span>'}</td><td style="white-space:nowrap;"><button class="btn btn-warning btn-sm" onclick="adjuntarArchivo('fijo',${g.id},'${key}')">📎</button>${g.archivo?`<button class="btn btn-danger btn-sm" onclick="quitarAdjunto('fijo',${g.id},'${key}')">✕</button>`:''}<button class="btn btn-danger btn-sm" onclick="delFijo(${g.id},'${key}')">🗑</button></td></tr>`).join('')}${fm.length===0?'<tr><td colspan="4" style="text-align:center;color:var(--text3)">Sin gastos fijos este mes</td></tr>':''}</tbody></table></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div class="card-title" style="margin:0">🔧 Gastos Variables — ${MESES[currentMonth]}</div><button class="btn btn-success btn-sm" onclick="openNuevoVariable()">+ Agregar</button></div><div class="table-wrap"><table><thead><tr><th>Descripción</th><th>Pago</th><th>Boleta</th><th>Monto</th><th>Comprobante</th><th></th></tr></thead><tbody>${va.map(g=>`<tr><td>${g.descripcion}</td><td><span class="badge badge-orange">${g.tipoPago}</span></td><td style="font-size:11px;color:var(--text3)">${g.boleta||'—'}</td><td><strong>${fmt(g.monto)}</strong></td><td>${g.archivo?`<button class="btn btn-ghost btn-sm" onclick="verArchivo('var',${g.id})">📎 Ver</button>`:'<span style="color:var(--text3)">—</span>'}</td><td style="white-space:nowrap;"><button class="btn btn-warning btn-sm" onclick="adjuntarArchivo('var',${g.id})">📎</button>${g.archivo?`<button class="btn btn-danger btn-sm" onclick="quitarAdjunto('var',${g.id})">✕</button>`:''}<button class="btn btn-danger btn-sm" onclick="delVariable(${g.id})">🗑</button></td></tr>`).join('')}${va.length===0?'<tr><td colspan="6" style="text-align:center;color:var(--text3)">Sin gastos variables en ${MESES[currentMonth]}</td></tr>':''}</tbody></table></div></div>`;}
function openNuevoFijo(key){document.getElementById('modal-area').innerHTML=`<div class="modal-overlay open" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-title">Nuevo Gasto Fijo</div><div class="form-row"><div><label class="fl">Descripción</label><input class="fi" id="gf-d"/></div></div><div class="form-row"><div><label class="fl">Monto Mensual ($)</label><input class="fi" id="gf-m" type="number" placeholder="0"/></div></div><div class="form-row"><label class="fl">Comprobante (opcional)</label><div class="file-drop" onclick="document.getElementById('gf-file').click()">📎 Adjuntar imagen o PDF</div><input type="file" id="gf-file" accept="image/*,application/pdf" style="display:none" onchange="previewFile(this,'gf-prev')"/><div id="gf-prev"></div></div><div style="display:flex;gap:10px;margin-top:10px;"><button class="btn btn-primary" onclick="saveFijo('${key}')">Guardar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div></div></div>`;}
function saveFijo(key){const d=document.getElementById('gf-d').value.trim();const m=parseInt(document.getElementById('gf-m').value)||0;if(!d||m<=0){showToast('Complete los campos','error');return;}const f=document.getElementById('gf-file');const p=(a)=>{if(!appData.gastosFijos)appData.gastosFijos={};if(!appData.gastosFijos[key])appData.gastosFijos[key]=[];appData.gastosFijos[key].push({id:Date.now(),descripcion:d,monto:m,archivo:a});saveData();closeModal();renderView();showToast('Gasto fijo agregado ✓','success');};if(f.files.length>0)compressImage(f.files[0],p);else p(null);}
function delFijo(id,key){if(!appData.gastosFijos||!appData.gastosFijos[key])return;appData.gastosFijos[key]=appData.gastosFijos[key].filter(g=>g.id!=id);saveData();renderView();showToast('Eliminado');}
function quitarAdjunto(t,id,key){if(!confirm('¿Quitar el comprobante adjunto?'))return;if(t==='fijo'){if(!appData.gastosFijos||!appData.gastosFijos[key])return;const g=appData.gastosFijos[key].find(x=>x.id==id);if(g)delete g.archivo;}else{const g=(appData.gastosVariables||[]).find(x=>x.id==id);if(g)delete g.archivo;}saveData();renderView();showToast('Adjunto quitado ✓','success');}
function openNuevoVariable(){const {currentYear,currentMonth}=state;document.getElementById('modal-area').innerHTML=`<div class="modal-overlay open" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-title">Nuevo Gasto Variable — ${MESES[currentMonth]}</div><div class="form-row"><div><label class="fl">Descripción</label><input class="fi" id="gv-d"/></div></div><div class="form-row form-row-2"><div><label class="fl">Tipo de Pago</label><select class="fi" id="gv-t"><option>Efectivo</option><option>Transferencia</option><option>Cheque</option></select></div><div><label class="fl">Monto ($)</label><input class="fi" id="gv-m" type="number" placeholder="0"/></div></div><div class="form-row"><div><label class="fl">N° Boleta (opcional)</label><input class="fi" id="gv-b"/></div></div><div class="form-row"><label class="fl">Comprobante (opcional)</label><div class="file-drop" onclick="document.getElementById('gv-file').click()">📎 Adjuntar imagen o PDF</div><input type="file" id="gv-file" accept="image/*,application/pdf" style="display:none" onchange="previewFile(this,'gv-prev')"/><div id="gv-prev"></div></div><div style="display:flex;gap:10px;margin-top:10px;"><button class="btn btn-success" onclick="saveVariable(${currentYear},${currentMonth})">Guardar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div></div></div>`;}
function saveVariable(a,m){const d=document.getElementById('gv-d').value.trim();const tp=document.getElementById('gv-t').value;const m2=parseInt(document.getElementById('gv-m').value)||0;const b=document.getElementById('gv-b').value.trim();if(!d||m2<=0){showToast('Complete los campos','error');return;}const f=document.getElementById('gv-file');const p=(a2)=>{if(!appData.gastosVariables)appData.gastosVariables=[];appData.gastosVariables.push({id:Date.now(),anio:a,mes:m,descripcion:d,tipoPago:tp,monto:m2,boleta:b,archivo:a2});saveData();closeModal();renderView();showToast('Gasto registrado ✓','success');};if(f.files.length>0)compressImage(f.files[0],p);else p(null);}
function delVariable(id){appData.gastosVariables=(appData.gastosVariables||[]).filter(g=>g.id!=id);saveData();renderView();showToast('Eliminado');}
function vFormularios(){const s=state.formulariosSortAsc;const so=[...(appData.formularios||[])].sort((a,b)=>s?a.fecha.localeCompare(b.fecha):b.fecha.localeCompare(a.fecha));
return `<div class="page-title">Formulario de Comprobantes</div><div class="page-sub">Genera comprobantes genéricos descargables en JPG</div><div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"><button class="btn btn-success" onclick="openNuevoFormulario()">+ Nuevo Comprobante</button><button class="btn btn-ghost btn-sm" onclick="toggleFormulariosSort()">🔄 Ordenar: ${s?'Reciente → Antiguo':'Antiguo → Reciente'}</button></div><div class="card">${so.length===0?`<div style="text-align:center;padding:28px;color:var(--text3)">No hay comprobantes generados</div>`:`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Actividad</th><th>Monto</th><th>Tipo</th><th style="width:140px;"></th></tr></thead><tbody>${so.map(f=>`<tr><td>${f.fecha}</td><td>${f.actividad}</td><td><strong>${fmt(f.monto)}</strong></td><td><span class="badge badge-navy">${f.tipo}</span></td><td style="white-space:nowrap;"><button class="btn btn-primary btn-sm" onclick="descargarFormulario(${f.id})">⬇</button><button class="btn btn-outline btn-sm" onclick="openNuevoFormulario(${f.id})">✎</button><button class="btn btn-danger btn-sm" onclick="eliminarFormulario(${f.id})">✕</button></td></tr>`).join('')}</tbody></table></div>`}</div>`;}
function openNuevoFormulario(editId=null){let f=editId?(appData.formularios||[]).find(x=>x.id===editId):null;document.getElementById('modal-area').innerHTML=`<div class="modal-overlay open" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-title">${f?'Editar Comprobante':'Nuevo Comprobante'}</div><div class="form-row"><div><label class="fl">Actividad / Descripción</label><input class="fi" id="fo-act" value="${f?f.actividad:''}"/></div></div><div class="form-row form-row-2"><div><label class="fl">Monto Total ($)</label><input class="fi" id="fo-monto" type="number" placeholder="0" value="${f?f.monto:''}"/></div><div><label class="fl">Tipo de Pago</label><select class="fi" id="fo-tipo"><option ${f&&f.tipo==='Efectivo'?'selected':''}>Efectivo</option><option ${f&&f.tipo==='Transferencia'?'selected':''}>Transferencia</option></select></div></div><div class="form-row"><div><label class="fl">Fecha</label><input class="fi" id="fo-fecha" type="date" value="${f?f.fecha:new Date().toISOString().split('T')[0]}"/></div></div><div class="form-row"><div><label class="fl">Detalle (Opcional)</label><textarea class="fi" id="fo-detalle" rows="3">${f?f.detalle||'':''}</textarea></div></div><div style="display:flex;gap:10px;margin-top:10px;"><button class="btn btn-success" onclick="saveFormulario(${editId||'null'})">Guardar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div></div></div>`;}

function eliminarFormulario(id){if(!confirm('¿Eliminar este comprobante?'))return;appData.formularios=(appData.formularios||[]).filter(x=>x.id!==id);saveData();renderView();showToast('Eliminado');}

function generarVoucher(key,deptoId){const {currentYear,currentMonth}=state;const gc=getGC(currentYear,currentMonth);const depto=(appData.departamentos||[]).find(d=>d.id===deptoId);if(!depto)return;const ahora=new Date();const fs=ahora.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});const hs=ahora.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});const ms=MESES[currentMonth]+' '+currentYear;const W=600,H=820;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
const dv=(dl)=>{ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#0E7490');g.addColorStop(1,'#2DD4BF');ctx.fillStyle=g;ctx.fillRect(0,0,W,160);ctx.save();ctx.beginPath();ctx.arc(W/2,90,50,0,Math.PI*2);ctx.clip();dl(ctx,W/2,90,50);ctx.restore();ctx.beginPath();ctx.arc(W/2,90,52,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#111827';ctx.font='bold 15px Inter, Arial';ctx.textAlign='center';ctx.fillText('CONDOMINIO BOSQUES DEL SUR 4',W/2,175);ctx.fillStyle='#4B5563';ctx.font='500 13px Inter, Arial';ctx.fillText('Voucher válido como comprobante de pago',W/2,195);ctx.fillStyle='#10b981';roundRect(ctx,W/2-80,210,160,44,22);ctx.fill();ctx.fillStyle='#FFFFFF';ctx.font='bold 20px Inter, Arial';ctx.fillText('✓ PAGADO',W/2,239);ctx.strokeStyle='#E5E7EB';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(40,260);ctx.lineTo(W-40,260);ctx.stroke();let y=300;st(ctx,'Datos del Departamento',W,y);y+=40;dr(ctx,'Departamento',depto.numero,W,y);y+=44;dr(ctx,'Representante',depto.representante||'—',W,y);y+=44;dr(ctx,'Contacto',depto.contacto||'—',W,y);y+=50;ctx.strokeStyle='#E5E7EB';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-40,y);ctx.stroke();y+=30;st(ctx,'Datos del Pago',W,y);y+=40;dr(ctx,'Período',ms,W,y);y+=44;dr(ctx,'Monto Gasto Común',fmt(gc),W,y);y+=44;dr(ctx,'Fecha de Pago',fs,W,y);y+=44;dr(ctx,'Hora',hs,W,y);y+=50;ctx.strokeStyle='#E5E7EB';ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-40,y);ctx.stroke();y+=30;ctx.fillStyle='#9CA3AF';ctx.font='11px Inter, Arial';ctx.textAlign='center';ctx.fillText('Documento generado automáticamente',W/2,y+20);ctx.fillText('Condominio Bosques del Sur 4 — '+new Date().getFullYear(),W/2,y+38);ctx.fillStyle='#0E7490';ctx.fillRect(0,H-8,W,8);try{return cv.toDataURL('image/jpeg',0.95);}catch(e){return null;}};
const fb=(ctx,cx,cy,r)=>{ctx.fillStyle='#F1F5F9';ctx.fillRect(cx-r,cy-r,r*2,r*2);ctx.fillStyle='#0E7490';ctx.font=`bold ${r*0.7}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('CBS4',cx,cy+2);ctx.textBaseline='alphabetic';};

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function compressImage(file,cb,q=0.6){if(!file||!file.type.match('image.*')){const r=new FileReader();r.onload=e=>cb({name:file.name,type:file.type,data:e.target.result});r.readAsDataURL(file);return;}const r=new FileReader();r.onload=function(ev){const img=new Image();img.onload=function(){const cv=document.createElement('canvas');const cx=cv.getContext('2d');const mw=1024,mh=1024;let w=img.width,h=img.height;if(w>h){if(w>mw){h*=mw/w;w=mw;}}else{if(h>mh){w*=mh/h;h=mh;}}cv.width=w;cv.height=h;cx.drawImage(img,0,0,w,h);cb({name:file.name.replace(/\.[^/.]+$/,'.jpg'),type:'image/jpeg',data:cv.toDataURL('image/jpeg',q)});};img.onerror=()=>{const r2=new FileReader();r2.onload=e=>cb({name:file.name,type:file.type,data:e.target.result});r2.readAsDataURL(file);};img.src=ev.target.result;};r.readAsDataURL(file);}
